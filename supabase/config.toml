# Minimal config so `supabase functions deploy` works from a clone.
# Run `supabase init` if you later want the full local-development stack
# (database, studio, migrations) — it generates a much longer file.

project_id = "qbqjmdyqknuqlkfbubml"

[functions.admin-users]
# Sign-in is Clerk's, and the function verifies the Clerk session token
# itself (signature, expiry, allowed origin) with CLERK_SECRET_KEY, then
# re-reads the caller's role from the database — a valid token only proves
# who someone is, not what they may do. Supabase's gateway check is built
# for Supabase's own tokens, so it is turned off here; the function refuses
# every request that fails its own check.
verify_jwt = false
