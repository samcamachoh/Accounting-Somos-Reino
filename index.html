<!--
  The whole portal. One shell, one navigation, one view container —
  which of the views appear in the rail is decided by the signed-in
  person's capabilities, in src/lib/access.js.

  Nothing here is painted until that resolves (see body:not(.booted)
  in app.css), so a member never watches the finance rail appear and
  then vanish.
-->
<div class="shell" id="shell">
  <aside class="rail">
    <div class="brand">
      <svg viewBox="0 0 3000 3000" aria-hidden="true"><use href="#mark"/></svg>
      <div>
        <div class="brand-name">Somos Reino</div>
        <div class="brand-sub" id="brandSub"></div>
      </div>
    </div>
    <nav class="nav" id="nav" aria-label="Somos Reino"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <div class="crumb" id="crumb"></div>
        <h1 id="title"></h1>
      </div>
      <div class="topbar-actions" id="topActions"></div>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>

<div id="modalRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>
