<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Somos Reino — Dar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Schibsted+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#F7746D; --coral-deep:#C8483F; --coral-wash:#FDECEA;
  --ink:#17151C; --paper:#FBF8F6; --card:#FFFFFF;
  --line:#EEE6E0; --line-2:#DED3CA;
  --text:#1E1B22; --text-2:#6C6570; --text-3:#A29AA0;
  --sage:#3F7A63; --sage-wash:#E7F1EC;
  --amber:#A97613; --amber-wash:#FBF0DC;
  --blue:#2F6E8F; --blue-wash:#E6EFF3;
  --plum:#8A4A6B; --plum-wash:#F3E7ED;
  --r:18px; --r-lg:24px; --r-sm:12px;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ui:"Schibsted Grotesk",system-ui,sans-serif;
  --display:"Bricolage Grotesque","Schibsted Grotesk",sans-serif;
  --navh:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--ui);background:var(--paper);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45;padding-bottom:calc(var(--navh) + 22px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:rgba(251,248,246,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:13px 18px}
.hdr-in svg{width:24px;height:24px;fill:var(--coral);flex:0 0 auto}
.hdr-name{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.03em}
.langsw{margin-left:auto;display:flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:var(--card)}
.langsw button{padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--text-3);letter-spacing:.03em;position:relative}
/* Header controls stay visually compact but carry a 44px touch target
   (WCAG 2.5.5), which the pill and avatar are far too small to meet on
   their own. */
.langsw button::after{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
.langsw button[aria-pressed="true"]{background:var(--ink);color:#fff}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--coral);color:#3A100D;display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 auto;position:relative;text-decoration:none}
.avatar::after{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%)}

.wrap{max-width:640px;margin:0 auto;padding:18px 18px 8px}

/* nav */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(23,21,28,.14)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:5px 10px;border-radius:12px;color:#8B8394;flex:1;max-width:110px;min-height:44px;text-decoration:none}
.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;font-weight:600;letter-spacing:.01em}
.tab[aria-current="true"]{color:#fff}
.tab[aria-current="true"] svg{stroke:var(--coral)}
@media(min-width:760px){
  /* The nav sits after <main> in the DOM, which is right for the fixed
     bottom bar on phones. Once it goes static it was landing at the foot
     of a ~1200px page — off-screen on any laptop — so reorder it above
     the content, which its own bottom margin already assumed. */
  body{padding-bottom:40px;display:flex;flex-direction:column}
  .hdr{order:1}
  #tabbar{order:2}
  #view{order:3}
  #modalRoot{order:4}
  .tabbar{position:static;background:var(--card);border:1px solid var(--line);border-radius:999px;max-width:460px;margin:0 auto 22px;padding:5px;box-shadow:none}
  .tab{flex-direction:row;border-radius:999px;padding:8px 14px}
  .tab[aria-current="true"]{background:var(--ink)}
  .tab span{font-size:12.5px}
}

/* primitives */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-3)}
h1{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.03em;line-height:1.08}
h2{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.025em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;border:1px solid var(--line-2);background:var(--card);transition:transform .08s,background .13s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--coral);border-color:var(--coral);color:#3A100D}
.btn-primary:hover{background:#F4605A}
.btn-primary:disabled{background:#EFE3DF;border-color:#EFE3DF;color:var(--text-3);cursor:not-allowed}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:#F1EAE5}
.btn-sm{padding:6px 12px;font-size:12.5px}
/* 32px suits a mouse and keeps these rows dense, but Pause, Cancel,
   Save and Remove are all finger targets on a phone. Size them by the
   input device rather than shrinking the desktop layout to suit touch. */
@media(max-width:759px),(pointer:coarse){
  .btn-sm{min-height:44px;padding:8px 14px}
  .link{position:relative;display:inline-block}
  .link::after{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
}
.btn-block{width:100%}
.link{color:var(--coral-deep);font-weight:600;font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-family:var(--mono);font-size:10px;letter-spacing:.03em;text-transform:uppercase;font-weight:600}
.t-ok{background:var(--sage-wash);color:var(--sage)}
.t-wait{background:var(--amber-wash);color:var(--amber)}
.t-mute{background:#F1ECE9;color:var(--text-2)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-2)}
.input{border:1px solid var(--line-2);border-radius:12px;padding:11px 13px;background:var(--card);font-size:14.5px;width:100%}
.input:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-wash)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw-toggle{width:38px;height:22px;border-radius:12px;background:#DDD5CF;position:relative;flex:0 0 auto;transition:background .16s}
.sw-toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw-toggle[aria-pressed="true"]{background:var(--sage)}
.sw-toggle[aria-pressed="true"]::after{transform:translateX(16px)}
.section{display:flex;flex-direction:column;gap:12px;margin-bottom:22px}
.empty{padding:26px 16px;text-align:center;color:var(--text-2);font-size:13.5px}

/* give: fund cards */
.fundlist{display:flex;flex-direction:column;gap:8px}
.fundcard{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--card);text-align:left;width:100%;transition:border-color .12s,box-shadow .12s}
.fundcard[aria-pressed="true"]{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-wash)}
.fund-dot{width:11px;height:11px;border-radius:4px;margin-top:3px;flex:0 0 auto}
.fund-name{font-size:14.5px;font-weight:700}
.fund-blurb{font-size:12px;color:var(--text-2);margin-top:2px;line-height:1.4}
.fund-radio{margin-left:auto;width:19px;height:19px;border-radius:50%;border:2px solid var(--line-2);flex:0 0 auto;display:grid;place-items:center;margin-top:2px}
.fundcard[aria-pressed="true"] .fund-radio{border-color:var(--coral)}
.fundcard[aria-pressed="true"] .fund-radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--coral)}
.campaign{margin-top:9px}
.campaign-bar{height:6px;background:#F1ECE9;border-radius:4px;overflow:hidden}
.campaign-fill{height:100%;background:var(--sage);border-radius:4px}
.campaign-label{display:flex;justify-content:space-between;margin-top:5px;font-size:11px;color:var(--text-2)}

/* give: amount */
.amt-display{text-align:center;padding:22px 10px 6px}
.amt-display .cur{font-family:var(--display);font-size:22px;font-weight:700;vertical-align:top;position:relative;top:10px;color:var(--text-3)}
.amt-display .num{font-family:var(--display);font-size:56px;font-weight:800;letter-spacing:-.04em}
.amt-display input{border:none;background:none;text-align:center;font-family:var(--display);font-size:56px;font-weight:800;letter-spacing:-.04em;width:100%;color:var(--text)}
.amt-display input:focus{outline:none}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
/* Amount and frequency are the two controls everyone touches, so they
   get real height rather than an invisible hit area. */
.chip{padding:11px 17px;border-radius:999px;border:1.5px solid var(--line-2);background:var(--card);font-size:14px;font-weight:700;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.seg{display:flex;background:#F1ECE9;border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;padding:12px 8px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--text-2);min-height:44px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(23,21,28,.12)}
.paymethod-row{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);width:100%;text-align:left}
.paymethod-row[aria-pressed="true"]{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-wash)}
.cardchip{width:34px;height:24px;border-radius:5px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:9px;font-weight:700;flex:0 0 auto}
.feerow{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-sm)}
.feerow-t{font-size:13.5px;font-weight:600}
.feerow-d{font-size:11.5px;color:var(--text-2);margin-top:1px}
/* Sticky bars overlay whatever precedes their resting place, so the
   button and its caption were sitting on top of the amount chips. A fade
   to the page colour lets that content dissolve behind the bar instead
   of colliding with it. */
.cta-bar{position:sticky;bottom:calc(var(--navh) + 14px + env(safe-area-inset-bottom));margin-top:6px;padding:34px 0 4px;background:linear-gradient(180deg,rgba(251,248,246,0) 0%,rgba(251,248,246,.86) 34%,var(--paper) 54%)}
/* Stays sticky on desktop too. Making it static here put the give button
   below the fold on every laptop, while mobile kept it in reach; column
   height varies with content, so stickiness is what actually guarantees
   it is always visible. */
@media(min-width:760px){.cta-bar{bottom:20px;margin-top:18px}}
/* Wide screens: the giving flow ran to ~1230px in a 640px column, so the
   give button sat below the fold on a laptop while mobile kept it stuck
   to the viewport. Put the fund picker alongside the amount, frequency,
   payment and total stack so the whole decision fits on one screen.
   Scoped to the give form — the success screen and the other views stay
   a single column. */
@media(min-width:1000px){
  body[data-give-form="1"] .hdr-in{max-width:1000px}
  body[data-give-form="1"] #view{
    max-width:1000px;
    display:grid;
    grid-template-columns:minmax(0,380px) minmax(0,1fr);
    column-gap:34px;
    align-items:start;
  }
  /* Every child, not just .section — the CTA bar is a sibling of the
     sections and would otherwise be auto-placed into the empty column. */
  body[data-give-form="1"] #view > *{grid-column:2}
  /* Span every row, otherwise the tall fund list defines row 1 and the
     rest of the right-hand column gets pushed down past a dead gap.
     A generous span keeps it correct if a section is ever added. */
  body[data-give-form="1"] #view > .section:first-child{grid-column:1;grid-row:1 / span 20;position:sticky;top:20px}
}
.totalline{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 10px;font-size:12.5px;color:var(--text-2)}
.totalline b{font-family:var(--mono);color:var(--text);font-size:13px}

.success{background:var(--sage-wash);border:1px solid #BFDDCF;border-radius:var(--r);padding:20px 18px;text-align:center}
.success .mark{width:40px;height:40px;border-radius:50%;background:var(--sage);color:#fff;display:grid;place-items:center;margin:0 auto 10px;font-size:18px}
.success h2{color:var(--sage)}
.success p{font-size:13.5px;color:var(--text-2);margin-top:5px}
.success .row{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}

/* rhythm grid */
.rhythm{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 6px}
@media(min-width:420px){.rhythm{grid-template-columns:repeat(6,1fr)}}
.rmonth{display:flex;flex-direction:column;align-items:center;gap:5px}
.rdot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center}
.rdot.gave{background:var(--coral);border-color:var(--coral)}
.rdot.gave::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.rdot.future{border-style:dashed;border-color:#E6DDD6;opacity:.55}
.rmonth span{font-size:10px;color:var(--text-2);font-weight:600}
.rlegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--text-2)}
.rlegend span{display:inline-flex;align-items:center;gap:6px}
.rlegend i{width:12px;height:12px;border-radius:50%;display:inline-block}

/* history rows */
.yeargroup{margin-bottom:18px}
.yeargroup-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.yeargroup-hd .y{font-family:var(--display);font-size:16px;font-weight:800}
.yeargroup-hd .amt{margin-left:auto;font-family:var(--mono);font-size:14px;font-weight:600}
.giftrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #F2ECE8}
.giftrow:last-child{border-bottom:none}
.giftrow-dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.giftrow-desc{font-size:13.5px;font-weight:600}
.giftrow-meta{font-size:11.5px;color:var(--text-2);margin-top:1px}
.giftrow-amt{margin-left:auto;font-family:var(--mono);font-size:14.5px;font-weight:600}

/* recurring cards */
.reccard{padding:15px 16px}
.reccard-top{display:flex;align-items:flex-start;gap:10px}
.reccard-amt{font-family:var(--display);font-size:21px;font-weight:800;letter-spacing:-.03em}
.reccard-fund{font-size:12.5px;color:var(--text-2);margin-top:2px}
.reccard-actions{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.reccard.paused{opacity:.62}

/* account */
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #F2ECE8;font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-2)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(23,21,28,.42);display:grid;place-items:center;z-index:60;padding:18px}
.modal{background:var(--card);border-radius:22px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(23,21,28,.28);overflow:hidden}
.modal-hd{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal-t{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.03em}
.modal-d{font-size:12.5px;color:var(--text-2);margin-top:3px}
.modal-bd{padding:16px 20px;display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow:auto}
.modal-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#FCFAF9}
#toast{position:fixed;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,14px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:80;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:760px){#toast{bottom:22px}}

@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms !important;animation-duration:.01ms !important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-in">
    <svg viewBox="0 0 3000 3000"><use href="#mark"/></svg>
    <span class="hdr-name">Somos Reino</span>
    <div class="langsw" role="group" aria-label="Language">
      <button data-lang="es" aria-pressed="true">ES</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
    <a class="avatar" href="/index.html" aria-label="Account">MO</a>
  </div>
</header>

<main class="wrap" id="view"></main>

<nav class="tabbar" id="tabbar"></nav>
<div id="modalRoot"></div>
<div id="toast"></div>

<script type="module">
import { getPortalSession, mountAuthGate, mountForbiddenGate } from "/src/lib/auth.js";
import { loadGivingSnapshot, openBillingPortal, startCheckout } from "/src/lib/api.js";
import { showModeBadge } from "/src/lib/status.js";
/* ============================================================
   Somos Reino — giver portal (give, history, recurring, account)
   Single-file demo. In-memory sample data, bilingual ES/EN.
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const money = n => (n<0?"-":"") + "$" + Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = n => "$" + Math.round(n).toLocaleString("en-US");

/* ---------------- i18n ---------------- */
const STR = {
  appName:{es:"Somos Reino", en:"Somos Reino"},
  navGive:{es:"Dar", en:"Give"},
  navHistory:{es:"Historial", en:"History"},
  navRecurring:{es:"Recurrente", en:"Recurring"},

const feeFor = amt => Math.round((amt*0.029+0.30)*100)/100;

/* ---------------- derived ---------------- */
const years = () => [...new Set(gifts.map(g=>g.date.slice(0,4)))].map(Number).sort((a,b)=>b-a);
const giftsInYear = y => gifts.filter(g=>g.date.slice(0,4)===String(y)).sort((a,b)=>b.date.localeCompare(a.date));
const totalInYear = y => giftsInYear(y).reduce((s,g)=>s+g.amount,0);
const ytdTotal = () => totalInYear(2026);

const fundName = id => fundById(id).name[state.lang];
const methodLabel = m => m==="card" ? {es:"Tarjeta",en:"Card"}[state.lang] : m;
const fmtDate = iso => {
  const d = new Date(iso+"T12:00:00");
  return MONTHS[state.lang][d.getMonth()] + " " + d.getDate();
};

function monthsForYear(y){
  return MONTHS[state.lang].map((label,i)=>{
    const gave = gifts.some(g=>{const d=new Date(g.date+"T12:00:00"); return d.getFullYear()===y && d.getMonth()===i;});
    const isFuture = y===TODAY.getFullYear() && i>TODAY.getMonth();
    return {label, gave, isFuture};
  });
}

function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("on"), 2400);
}

/* ---------------- render ---------------- */
const VIEWS = {give:viewGive, history:viewHistory, recurring:viewRecurring};
/* Account is not a view here — it lives on the member portal home,
   so that tab leaves the page rather than switching one. */
const NAV = [
  {id:"give", label:"navGive", ico:'M9 3.5v11M3.5 9h11'},
  {id:"history", label:"navHistory", ico:'M9 4.5v5l3.5 2M9 3a6 6 0 1 1-5.2 3'},
  {id:"recurring", label:"navRecurring", ico:'M3 6.5A5.5 5.5 0 0 1 13.7 5M15 5V2M15 5h-3M15 11.5A5.5 5.5 0 0 1 4.3 13M3 13v3M3 13h3'},
  {id:"account", label:"navAccount", href:"/index.html", ico:'M9 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM3.5 15.5c0-3 2.5-5 5.5-5s5.5 2 5.5 5'},
];
function render(){
  document.documentElement.lang = state.lang;
  /* Lets the stylesheet lay the give form out in two columns on wide
     screens without the success screen inheriting it. */
  document.body.dataset.giveForm = (state.view === "give" && !state.justGave) ? "1" : "";
  $("#view").innerHTML = VIEWS[state.view]();
  $("#tabbar").innerHTML = NAV.map(n=>{
    const inner = `<svg viewBox="0 0 18 18" aria-hidden="true"><path d="${n.ico}"/></svg><span>${t(n.label)}</span>`;
    return n.href
      ? `<a class="tab" href="${n.href}">${inner}</a>`
      : `<button class="tab" data-nav="${n.id}" aria-current="${state.view===n.id}">${inner}</button>`;
  }).join("");
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.lang===state.lang)));
  $("#modalRoot").innerHTML = modalHTML();
}

/* ---------------- events ---------------- */
document.addEventListener("click", async e=>{
  const t_ = e.target.closest("[data-nav],[data-lang],[data-fund],[data-amt],[data-freq],[data-card],[data-act],[data-year],[data-scrim]");
  if(!t_) return;
  if(t_.hasAttribute("data-scrim") && e.target===t_){ state.modal=null; return render(); }

  if(t_.dataset.lang){ state.lang=t_.dataset.lang; localStorage.setItem("sr-lang", state.lang); return render(); }
  if(t_.dataset.nav){ state.view=t_.dataset.nav; state.justGave=null; window.scrollTo({top:0}); return render(); }
  if(t_.dataset.fund){ state.giveFund=t_.dataset.fund; return render(); }
  if(t_.dataset.year){ state.historyYear=Number(t_.dataset.year); return render(); }
  if(t_.dataset.card){ state.giveCard=t_.dataset.card; return render(); }
  if(t_.dataset.freq){ state.giveFreq=t_.dataset.freq; return render(); }
  if(t_.dataset.amt){
    if(t_.dataset.amt==="custom"){ state.giveCustom=true; }
    else { state.giveCustom=false; state.giveAmount=Number(t_.dataset.amt); }
    render();
    if(state.giveCustom){ const el=$("#customAmt"); if(el){ el.focus(); } }
    return;
  }
  const act = t_.dataset.act;
  if(!act) return;

  if(act==="toggleFee"){ state.coverFee=!state.coverFee; return render(); }

  if(act==="submitGive"){
    if(backendMode!=="ready" && !state.giveCard) return;
    const amt = state.giveAmount;
    if(!(amt>0)) return;
    if(backendMode==="ready"){
      try{
        toast(state.lang==="es" ? "Abriendo el pago seguro…" : "Opening secure checkout…");
        await startCheckout({
          fundId: fundById(state.giveFund).dbId,
          amountCents: Math.round(amt*100),
          frequency: state.giveFreq,
          coverFee: state.coverFee,
        });
      }catch(error){ toast(error.message); }
      return;
    }
    const today = new Date().toISOString().slice(0,10);
    if(state.giveFreq==="once"){
      gifts.unshift({id:"g"+Date.now(), date:today, fund:state.giveFund, amount:amt, method:"card", cardId:state.giveCard, recurringId:null});
    } else {
      const rid = "r"+Date.now();
      recurring.unshift({id:rid, fund:state.giveFund, amount:amt, freq:state.giveFreq, next:today, cardId:state.giveCard, status:"active"});
      gifts.unshift({id:"g"+Date.now(), date:today, fund:state.giveFund, amount:amt, method:"card", cardId:state.giveCard, recurringId:rid});
    }
    state.justGave = {amount:amt, fund:state.giveFund, freq:state.giveFreq};
    return render();
  }
  if(act==="giveAgain"){ state.justGave=null; state.giveCustom=false; return render(); }

  if(act==="addCard"){
    if(backendMode==="ready") { try{ await openBillingPortal(); }catch(error){ toast(error.message); } return; }
    state.modal={kind:"addCard"}; return render();
  }
  if(act==="emailStatement"){ toast(t("statementSent",{y:t_.dataset.year})); return; }

  if(act==="toggleRec"){
    if(backendMode==="ready") { try{ await openBillingPortal(); }catch(error){ toast(error.message); } return; }
    const r = recurring.find(x=>x.id===t_.dataset.rid);
    r.status = r.status==="active" ? "paused" : "active";
    toast(r.status==="paused" ? t("recPaused") : t("recResumed"));
    return render();
  }
  if(act==="editRec"){
    if(backendMode==="ready") { try{ await openBillingPortal(); }catch(error){ toast(error.message); } return; }
    state.modal={kind:"editRec", rid:t_.dataset.rid}; return render();
  }
  if(act==="cancelRec"){
    if(backendMode==="ready") { try{ await openBillingPortal(); }catch(error){ toast(error.message); } return; }
    state.modal={kind:"cancelRec", rid:t_.dataset.rid}; return render();
  }
  if(act==="startRecurring"){ state.view="give"; state.giveFreq="monthly"; state.justGave=null; window.scrollTo({top:0}); return render(); }

  if(act==="closeModal"){ state.modal=null; return render(); }
  if(act==="confirmModal"){
    const kind = state.modal?.kind;
    if(kind==="addCard"){
      const num = $("#mc_num")?.value.replace(/\s/g,"")||"";
      if(num.length<8){ toast(t("needAmount")); return; }
      const last4 = num.slice(-4);
      const brand = num.startsWith("4") ? "VISA" : num.startsWith("5") ? "MC" : "CARD";
      const id = "c"+Date.now();
      cards.push({id, brand, last4, exp:$("#mc_exp")?.value||"—", isDefault:cards.length===0});
      state.giveCard = state.giveCard || id;
      toast(t("cardAdded"));
    } else if(kind==="editRec"){
      const r = recurring.find(x=>x.id===state.modal.rid);
      const v = parseFloat($("#me_amt")?.value||"0");
      if(v>0){ r.amount=v; toast(t("recUpdated")); }
    } else if(kind==="cancelRec"){
      recurring = recurring.filter(x=>x.id!==state.modal.rid);
      toast(t("recCancelled"));
    }
    state.modal=null;
    return render();
  }
});

document.addEventListener("input", e=>{
  if(e.target.id==="customAmt"){
    const v = parseFloat(e.target.value.replace(/[^\d.]/g,""))||0;
    state.giveAmount = v;
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && state.modal){ state.modal=null; render(); } });

function hydrateGiving(snapshot, profile){
  FUNDS = snapshot.funds.map(f=>({
    id:f.slug, dbId:f.id, color:f.color, wash:f.color+"1f",
    name:{es:f.name_es,en:f.name_en},
    blurb:{es:f.description_es,en:f.description_en},
    ...(f.campaign_goal_cents ? {campaign:{goal:f.campaign_goal_cents/100,raised:f.current_balance_cents/100}} : {}),
  }));
  ME = { name:profile.full_name };
  cards = snapshot.paymentMethods.map(m=>({
    id:m.id, brand:(m.brand||"CARD").toUpperCase(), last4:m.last4,
    exp:m.exp_month&&m.exp_year ? `${String(m.exp_month).padStart(2,"0")}/${String(m.exp_year).slice(-2)}` : "—",
    isDefault:m.is_default,
  }));
  gifts = snapshot.donations.map(g=>({
    id:g.id, date:g.occurred_at.slice(0,10), fund:g.funds.slug,
    amount:g.amount_cents/100, method:g.payment_method_type||"card",
    cardId:null, recurringId:g.recurring_gift_id,
  }));
  recurring = snapshot.recurring.map(r=>({
    id:r.id, fund:r.funds.slug, amount:r.amount_cents/100,
    freq:r.interval==="week"?"weekly":"monthly",
    next:r.next_charge_at?.slice(0,10)||"", cardId:null, status:r.status,
  }));
  state.giveFund = FUNDS[0]?.id || null;
  state.giveCard = cards.find(c=>c.isDefault)?.id || cards[0]?.id || null;
  state.historyYear = new Date().getFullYear();
  const avatar=document.querySelector(".avatar"); if(avatar) avatar.textContent=ME.name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
}

async function startPortal(){
  render();
  try{
    const session = await getPortalSession();
    backendMode = session.mode;
    if(session.mode==="demo") return showModeBadge({mode:"demo",portal:"Giving"});
    if(session.mode==="signed-out") return mountAuthGate();
    if(session.mode==="disabled") return mountForbiddenGate("This account has been deactivated. Ask a church administrator to restore access.");
    const snapshot = await loadGivingSnapshot(session.user.id);
    hydrateGiving(snapshot, session.profile);
    render();
    showModeBadge({mode:"ready",portal:"Giving"});
  }catch(error){
    showModeBadge({mode:"error",portal:"Giving",error:error.message});
  }
}

await startPortal();
</script>
