<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Somos Reino · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--coral:#F7746D;--coral-deep:#C8483F;--coral-wash:#FDECEA;--ink:#17151C;--paper:#FAF7F5;--card:#fff;--line:#E9E2DD;--line-2:#D8CFC8;--text:#1E1B22;--text-2:#6A6371;--text-3:#9A9299;--sage:#3F7A63;--sage-wash:#E7F1EC;--amber:#A97613;--amber-wash:#FBF0DC;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:"Schibsted Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:32px 24px 80px}
header.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:26px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-2);font-weight:700}
h1{font:800 clamp(30px,5vw,42px)/1.02 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;margin:10px 0 8px}
.lead{color:var(--text-2);line-height:1.5;max-width:620px}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer}
.btn{padding:10px 16px;border-radius:9px;border:1px solid var(--line-2);background:#fff;color:var(--text);font:600 14px/1 inherit}
.btn:hover{border-color:var(--text-3)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.danger{color:var(--coral-deep);border-color:#F3C9C5}
.btn:disabled{opacity:.55;cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
.stat .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:700}
.stat .v{font:800 27px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin-top:7px}
.stat .n{font-size:12px;color:var(--text-2);margin-top:3px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font:700 14px/1 inherit;color:var(--text-2);margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--text);border-bottom-color:var(--coral)}
.tabs .count{font-family:var(--mono);font-size:11px;color:var(--text-3);margin-left:6px}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.toolbar input,.toolbar select{padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;font:400 14px/1 inherit;background:#fff;color:inherit}
.toolbar input{flex:1;min-width:200px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:700;padding:14px 16px;border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.inactive td{opacity:.55}
.who{display:flex;align-items:center;gap:11px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px/1 inherit;flex:none}
.av.sq{border-radius:10px}
.nm{font-weight:600}
.em{color:var(--text-2);font-size:13px}
.tag{display:inline-block;padding:4px 9px;border-radius:999px;font:700 11px/1.25 inherit;letter-spacing:.02em}
.tag.admin{background:var(--coral-wash);color:var(--coral-deep)}
.tag.finance{background:var(--sage-wash);color:var(--sage)}
.tag.member{background:#F0EAE6;color:var(--text-2)}
.tag.off{background:var(--amber-wash);color:var(--amber)}
.seen{font-family:var(--mono);font-size:12px;color:var(--text-2)}
.money{font-family:var(--mono);font-size:13px;font-weight:500}
.chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:#F5F0EC;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:500}
.chip b{font-weight:700;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.chip.more{background:none;color:var(--text-3);font-size:12px}
.linkish{background:none;border:0;padding:0;color:var(--coral-deep);font:600 13px/1 inherit;text-decoration:underline;cursor:pointer}
.rowacts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.rowacts button{padding:6px 10px;border-radius:7px;border:1px solid var(--line-2);background:#fff;font:600 12px/1 inherit;color:var(--text-2)}
.rowacts button:hover{color:var(--text);border-color:var(--text-3)}
.rowacts button.danger:hover{color:var(--coral-deep);border-color:#F3C9C5}
.empty{padding:48px 20px;text-align:center;color:var(--text-2)}
.empty .hint{font-size:13px;color:var(--text-3);margin-top:6px}
.scrim{position:fixed;inset:0;background:rgba(23,21,28,.42);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:18px;width:min(560px,100%);max-height:90vh;overflow:auto;padding:28px}
.modal h2{font:800 24px/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin-bottom:6px}
.modal p.sub{color:var(--text-2);font-size:14px;line-height:1.5;margin-bottom:20px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:9px;font:400 15px/1.2 inherit;background:#fff;color:inherit}
.field textarea{min-height:72px;resize:vertical;line-height:1.45}
.field .hint{font-size:12px;color:var(--text-3);margin-top:5px;line-height:1.45}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.perms{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:6px}
.perms label{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:500;color:var(--text);cursor:pointer;text-transform:capitalize}
/* The .field rule above stretches inputs to 100%; checkboxes must not be. */
.perms input[type=checkbox]{width:16px;height:16px;flex:none;margin:0;accent-color:var(--coral)}
.picker{border:1px solid var(--line);border-radius:11px;max-height:190px;overflow:auto}
.picker label{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;margin:0;color:var(--text);font-weight:500}
.picker label:last-child{border-bottom:0}
.picker input[type=checkbox]{width:16px;height:16px;flex:none;margin:0;accent-color:var(--coral)}
.picker .who-em{color:var(--text-3);font-size:12.5px;margin-left:auto}
.mlist{border:1px solid var(--line);border-radius:11px;margin-bottom:14px}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mrow:last-child{border-bottom:0}
.mrow .grow{flex:1;min-width:120px}
.mrow select{padding:7px 9px;border:1px solid var(--line-2);border-radius:8px;font:500 13px/1 inherit;background:#fff;color:inherit;width:auto}
.mrow .x{border:1px solid var(--line-2);background:#fff;border-radius:7px;padding:6px 10px;font:600 12px/1 inherit;color:var(--text-2)}
.mrow .x:hover{color:var(--coral-deep);border-color:#F3C9C5}
.modal .foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.modal .err{color:var(--coral-deep);font-size:14px;line-height:1.45;margin-top:14px;min-height:1.2em}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,14px);opacity:0;background:var(--ink);color:#fff;padding:11px 17px;border-radius:9px;font-size:13px;font-weight:500;z-index:80;transition:opacity .2s,transform .2s;pointer-events:none;max-width:min(520px,90vw)}
#toast.on{opacity:1;transform:translate(-50%,0)}
.banner{background:var(--amber-wash);border:1px solid #E8D5A8;color:var(--amber);padding:13px 16px;border-radius:12px;font-size:14px;line-height:1.5;margin-bottom:20px}
[hidden]{display:none !important}
@media(max-width:820px){ th.hide,td.hide{display:none} .wrap{padding:24px 16px 70px} .pair{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Somos Reino · Administración</div>
      <h1>Admin</h1>
      <p class="lead">Accounts and households in one place: who may sign in, what they can reach, and which family they give with. Only administrators can open this page.</p>
    </div>
    <div class="actions">
      <a class="btn" href="/finance.html">Finance</a>
      <button class="btn" id="btnSignOut">Sign out</button>
      <button class="btn primary" id="btnAdd">＋ Add person</button>
    </div>
  </header>

  <div class="banner" id="banner" hidden></div>

  <div class="stats" id="stats"></div>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabPeople" data-tab="people" aria-selected="true">People <span class="count" id="countPeople"></span></button>
    <button role="tab" id="tabFamilies" data-tab="families" aria-selected="false">Families <span class="count" id="countFamilies"></span></button>
  </div>

  <section id="panelPeople" role="tabpanel" aria-labelledby="tabPeople">
    <div class="toolbar">
      <input id="q" type="search" placeholder="Search by name, email, or family" aria-label="Search people">
      <select id="filterRole" aria-label="Filter by role">
        <option value="all">All roles</option>
        <option value="admin">Admin</option>
        <option value="finance">Finance</option>
        <option value="member">Member</option>
      </select>
      <select id="filterFamily" aria-label="Filter by family"></select>
      <select id="filterStatus" aria-label="Filter by status">
        <option value="all">Active and inactive</option>
        <option value="active" selected>Active only</option>
        <option value="inactive">Inactive only</option>
      </select>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Person</th>
            <th>Role</th>
            <th class="hide">Family</th>
            <th class="hide">Team</th>
            <th class="hide">Last sign-in</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden></div>
    </div>
  </section>

  <section id="panelFamilies" role="tabpanel" aria-labelledby="tabFamilies" hidden>
    <div class="toolbar">
      <input id="fq" type="search" placeholder="Search families by name, member, or address" aria-label="Search families">
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th>Family</th>
            <th>Members</th>
            <th class="hide">Contact</th>
            <th class="hide" style="text-align:right">Giving this year</th>
            <th style="text-align:right">Actions</th>
          </tr>
        </thead>
        <tbody id="frows"></tbody>
      </table>
      <div class="empty" id="fempty" hidden></div>
    </div>
  </section>
</div>

<div id="modalRoot"></div>
<div id="toast"></div>

<script type="module">
import { requireSession, signOut } from "/src/lib/auth.js";
import { isConfigured } from "/src/lib/supabase.js";
import {
  listUsers, createUser, updateUser, setUserPassword, sendPasswordReset, setUserActive, deleteUser,
  createFamily, updateFamily, deleteFamily, setUserFamily,
} from "/src/lib/admin.js";
import { showModeBadge } from "/src/lib/status.js";

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const AV = ["#F7746D","#3F7A63","#A97613","#5B5470","#2F6E8F","#8A4A6B","#4C6B3F"];
const avColor = (n) => AV[[...String(n||"?")].reduce((a,c)=>a+c.charCodeAt(0),0) % AV.length];
const initials = (n) => String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();

/* What someone may do inside the finance portal, on top of what
   their role already opens. The Edge Function keeps the same
   list, and writes every key on every save. */
const PERMS = ["finance","approve","refund","people","payouts","families"];

/* Where someone stands in their household. Blank is allowed —
   plenty of families never need to say. */
const FAMILY_ROLES = [
  { value:"",       label:"Not specified" },
  { value:"head",   label:"Head of household" },
  { value:"spouse", label:"Spouse" },
  { value:"child",  label:"Child" },
  { value:"other",  label:"Other" },
];
const familyRoleLabel = (v) => FAMILY_ROLES.find(r => r.value === (v || ""))?.label ?? "";

let users = [], families = [], callerId = null, live = false;

/* False when the families migration hasn't been run on this
   project. The people half of the page works either way, so the
   household fields come off the forms rather than sending columns
   the profiles table doesn't have yet. */
let familiesReady = true;
const state = { tab:"people", q:"", role:"all", status:"active", family:"all", fq:"", modal:null, busy:false };

let toastTimer;
function toast(message){
  const el = $("#toast");
  el.textContent = message; el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 4200);
}

/* ---------------- sample data, used only in demo mode ---------------- */
const DEMO_FAMILIES = [
  { id:"f1", name:"Camacho", primary_contact_id:"p1", phone:"(407) 555-0142", email:"camacho@somosreino.org", address_line1:"1204 Palmetto Ave", city:"Orlando", state:"FL", postal_code:"32801", giving_cents_ytd:412000, giving_year:new Date().getFullYear() },
  { id:"f2", name:"Ortega",  primary_contact_id:"p2", phone:"(407) 555-0198", email:"ortega@somosreino.org", address_line1:"88 Kingsley St",   city:"Orlando", state:"FL", postal_code:"32803", giving_cents_ytd:268500, giving_year:new Date().getFullYear() },
  { id:"f3", name:"Beltrán", primary_contact_id:null,  phone:"", email:"", address_line1:"", city:"", state:"", postal_code:"", giving_cents_ytd:91000, giving_year:new Date().getFullYear() },
];

const DEMO_USERS = [
  { id:"p1", full_name:"Sam Camacho",     email:"sam@somosreino.org",     role:"admin",   team_names:["Pastoral"],   is_active:true,  last_sign_in_at:new Date(Date.now()-36e5).toISOString(),   permissions:{finance:true,approve:true,refund:true,people:true,payouts:true,families:true}, family_id:"f1", family_role:"head" },
  { id:"p2", full_name:"Marisol Ortega",  email:"marisol@somosreino.org", role:"finance", team_names:["Care"],       is_active:true,  last_sign_in_at:new Date(Date.now()-864e5).toISOString(),  permissions:{finance:true,approve:true,refund:false,people:false,payouts:true,families:false}, family_id:"f2", family_role:"head" },
  { id:"p3", full_name:"Elias Moreno",    email:"elias@somosreino.org",   role:"member",  team_names:["Media"],      is_active:true,  last_sign_in_at:new Date(Date.now()-3*864e5).toISOString(), permissions:{}, family_id:null, family_role:null },
  { id:"p4", full_name:"Ana Beltrán",     email:"ana@somosreino.org",     role:"member",  team_names:["Kids"],       is_active:true,  last_sign_in_at:null,                                     permissions:{}, family_id:"f3", family_role:"head" },
  { id:"p5", full_name:"Roberto Salgado", email:"roberto@somosreino.org", role:"member",  team_names:["Facilities"], is_active:false, last_sign_in_at:new Date(Date.now()-90*864e5).toISOString(), permissions:{}, family_id:null, family_role:null },
  { id:"p6", full_name:"Crystal Camacho", email:"crystal@somosreino.org", role:"member",  team_names:["Hospitality"],is_active:true,  last_sign_in_at:new Date(Date.now()-2*36e5).toISOString(), permissions:{}, family_id:"f1", family_role:"spouse" },
  { id:"p7", full_name:"Noé Ortega",      email:"noe@somosreino.org",     role:"member",  team_names:["Youth"],      is_active:true,  last_sign_in_at:new Date(Date.now()-6*864e5).toISOString(), permissions:{}, family_id:"f2", family_role:"child" },
];

const roleLabel = (r) => r === "admin" ? "Admin" : r === "finance" ? "Finance" : "Member";
function sinceLabel(iso){
  if(!iso) return "never";
  const days = Math.floor((Date.now() - new Date(iso)) / 864e5);
  if(days <= 0) return "today";
  if(days === 1) return "yesterday";
  if(days < 30) return `${days}d ago`;
  if(days < 365) return `${Math.floor(days/30)}mo ago`;
  return `${Math.floor(days/365)}y ago`;
}
const money = (cents) => cents === null || cents === undefined
  ? "—"
  : (cents/100).toLocaleString("en-US", { style:"currency", currency:"USD", maximumFractionDigits:0 });

/* ---------------- families, as seen from the people list ---------------- */
const familyById = (id) => families.find(f => f.id === id) || null;
const membersOf = (familyId) => users.filter(u => u.family_id === familyId);
const personById = (id) => users.find(u => u.id === id) || null;

/** The household to show for a person: their family, or the loose
    surname the profile has always carried, or nothing. */
const householdOf = (user) => familyById(user.family_id)?.name || user.household_name || "";

/* ---------------- render ---------------- */
function visiblePeople(){
  const q = state.q.trim().toLowerCase();
  return users.filter(u => {
    if(state.role !== "all" && u.role !== state.role) return false;
    const active = u.is_active !== false;
    if(state.status === "active" && !active) return false;
    if(state.status === "inactive" && active) return false;
    if(state.family === "none" && u.family_id) return false;
    if(state.family !== "all" && state.family !== "none" && u.family_id !== state.family) return false;
    if(q && !`${u.full_name||""} ${u.email||""} ${householdOf(u)}`.toLowerCase().includes(q)) return false;
    return true;
  });
}

function visibleFamilies(){
  const q = state.fq.trim().toLowerCase();
  if(!q) return families;
  return families.filter(f => {
    const haystack = [
      f.name, f.email, f.phone, f.address_line1, f.address_line2, f.city, f.state, f.postal_code,
      ...membersOf(f.id).map(m => m.full_name),
    ].join(" ").toLowerCase();
    return haystack.includes(q);
  });
}

function renderStats(){
  const active = users.filter(u => u.is_active !== false).length;
  const admins = users.filter(u => u.role === "admin" && u.is_active !== false).length;
  const placed = users.filter(u => u.family_id && u.is_active !== false).length;
  const unplaced = active - placed;
  const neverIn = users.filter(u => !u.last_sign_in_at).length;

  const tiles = [
    { k:"People",    v:users.length,    n:`${active} active · ${users.length - active} inactive` },
    { k:"Admins",    v:admins,          n:admins === 1 ? "one way in — consider a second" : "can reach this page" },
    { k:"Families",  v:families.length, n:`${placed} ${placed === 1 ? "person" : "people"} placed` },
    { k:"No family", v:unplaced,        n:"active people not in a household" },
    { k:"Never signed in", v:neverIn,   n:"invited but not yet arrived" },
  ];

  $("#stats").innerHTML = tiles.map(t => `
    <div class="stat">
      <div class="k">${esc(t.k)}</div>
      <div class="v">${esc(t.v)}</div>
      <div class="n">${esc(t.n)}</div>
    </div>`).join("");
}

function renderPeople(){
  const list = visiblePeople();
  const rows = $("#rows"), empty = $("#empty");

  rows.innerHTML = list.map(u => {
    const active = u.is_active !== false;
    const name = u.full_name || u.email || "—";
    const teams = (u.team_names || []).join(", ") || "—";
    const self = u.id === callerId;
    const household = householdOf(u);
    const relation = u.family_id ? familyRoleLabel(u.family_role) : "";
    return `<tr class="${active ? "" : "inactive"}">
      <td>
        <div class="who">
          <div class="av" style="background:${avColor(name)}">${esc(initials(name))}</div>
          <div>
            <div class="nm">${esc(name)}${self ? ' <span class="tag member">you</span>' : ""}</div>
            <div class="em">${esc(u.email || "")}</div>
          </div>
        </div>
      </td>
      <td><span class="tag ${esc(u.role || "member")}">${esc(roleLabel(u.role))}</span>${active ? "" : ' <span class="tag off">Inactive</span>'}</td>
      <td class="hide">
        ${household
          ? `<div class="nm" style="font-size:14px">${esc(household)}</div>${relation && u.family_role ? `<div class="em">${esc(relation)}</div>` : ""}`
          : familiesReady ? `<button class="linkish" data-fam="${esc(u.id)}">Add to a family</button>` : `<span class="em">—</span>`}
      </td>
      <td class="hide">${esc(teams)}</td>
      <td class="hide seen">${esc(sinceLabel(u.last_sign_in_at))}</td>
      <td>
        <div class="rowacts">
          <button data-edit="${esc(u.id)}">Edit</button>
          <button data-pw="${esc(u.id)}">Password</button>
          ${familiesReady ? `<button data-fam="${esc(u.id)}">Family</button>` : ""}
          <button data-active="${esc(u.id)}">${active ? "Deactivate" : "Restore"}</button>
          <button class="danger" data-del="${esc(u.id)}">Delete</button>
        </div>
      </td>
    </tr>`;
  }).join("");

  const none = list.length === 0;
  empty.hidden = !none;
  if(none) empty.textContent = users.length ? "No one matches those filters." : "No accounts yet.";
  $("#countPeople").textContent = users.length;
}

function memberChips(list){
  if(!list.length) return `<span class="em">Nobody yet</span>`;
  const shown = list.slice(0, 4);
  return `<div class="chips">${
    shown.map(m => `<span class="chip">${esc(m.full_name || m.email || "—")}${
      m.family_role ? ` <b>${esc(m.family_role)}</b>` : ""
    }</span>`).join("")
  }${list.length > shown.length ? `<span class="chip more">+${list.length - shown.length} more</span>` : ""}</div>`;
}

function renderFamilies(){
  const list = visibleFamilies();
  const rows = $("#frows"), empty = $("#fempty");

  rows.innerHTML = list.map(f => {
    const members = membersOf(f.id);
    const contact = personById(f.primary_contact_id);
    const where = [f.address_line1, f.city, f.state].filter(Boolean).join(" · ");
    const reach = f.phone || f.email || contact?.email || "";
    return `<tr>
      <td>
        <div class="who">
          <div class="av sq" style="background:${avColor(f.name)}">${esc(initials(f.name))}</div>
          <div>
            <div class="nm">${esc(f.name)}</div>
            <div class="em">${esc(where || `${members.length} ${members.length === 1 ? "person" : "people"}`)}</div>
          </div>
        </div>
      </td>
      <td>${memberChips(members)}</td>
      <td class="hide">
        ${contact ? `<div class="nm" style="font-size:14px">${esc(contact.full_name || contact.email)}</div>` : `<div class="em">No primary contact</div>`}
        ${reach ? `<div class="em">${esc(reach)}</div>` : ""}
      </td>
      <td class="hide money" style="text-align:right">${esc(money(f.giving_cents_ytd))}</td>
      <td>
        <div class="rowacts">
          <button data-fedit="${esc(f.id)}">Edit</button>
          <button data-fmembers="${esc(f.id)}">Members</button>
          <button class="danger" data-fdel="${esc(f.id)}">Delete</button>
        </div>
      </td>
    </tr>`;
  }).join("");

  const none = list.length === 0;
  empty.hidden = !none;
  if(none){
    empty.innerHTML = !familiesReady
      ? `Families aren't set up on this project yet.<div class="hint">Apply <code>supabase/migrations/</code> — <code>supabase db push</code>, or paste the file into the SQL editor. Everything else on this page works meanwhile.</div>`
      : families.length
        ? "No families match that search."
        : `No families yet.<div class="hint">A family groups the people who give from one household, so an address and a phone number live in one place instead of on every account.</div>`;
  }
  $("#countFamilies").textContent = families.length;
}

function renderFamilyFilter(){
  const select = $("#filterFamily");
  const current = state.family;
  select.innerHTML = `
    <option value="all">All families</option>
    <option value="none">No family</option>
    ${families.map(f => `<option value="${esc(f.id)}">${esc(f.name)}</option>`).join("")}`;
  select.value = [...select.options].some(o => o.value === current) ? current : "all";

function render(){
  const people = state.tab === "people";
  $("#panelPeople").hidden = !people;
  $("#panelFamilies").hidden = people;
  $("#tabPeople").setAttribute("aria-selected", String(people));
  $("#tabFamilies").setAttribute("aria-selected", String(!people));
  $("#btnAdd").textContent = people ? "＋ Add person" : "＋ New family";

  $("#btnAdd").disabled = !people && !familiesReady;

  renderStats();

/* ---------------- modals ---------------- */
function closeModal(){ $("#modalRoot").innerHTML = ""; state.modal = null; }

/**
 * One modal shape for everything on this page.
 *
 * `onConfirm` is optional: without it the footer is a single
 * Close button, which is what the member manager wants — it
 * saves each change as it is made rather than at the end.
 */
function openModal({ title, sub, fields, confirmText, onConfirm, onMount, danger, closeText = "Cancel" }){
  state.modal = title;
  $("#modalRoot").innerHTML = `
    <div class="scrim" id="scrim">
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <h2>${esc(title)}</h2>
        ${sub ? `<p class="sub">${sub}</p>` : ""}
        <form id="mform">${fields}</form>
        <div class="err" id="merr"></div>
        <div class="foot">
          <button class="btn" id="mcancel" type="button">${esc(onConfirm ? closeText : "Close")}</button>
          ${onConfirm ? `<button class="btn ${danger ? "danger" : "primary"}" id="mok" type="button">${esc(confirmText)}</button>` : ""}
        </div>
      </div>
    </div>`;

  const finish = async () => {
    if(state.busy || !onConfirm) return;
    state.busy = true;
    const ok = $("#mok"), label = ok.textContent;
    ok.disabled = true; ok.textContent = "Working…"; $("#merr").textContent = "";
    try {
      await onConfirm();
      closeModal();
    } catch (error) {
      $("#merr").textContent = error.message;
      ok.disabled = false; ok.textContent = label;
    } finally {
      state.busy = false;
    }
  };

  $("#mcancel").addEventListener("click", closeModal);
  $("#mok")?.addEventListener("click", finish);
  $("#mform").addEventListener("submit", (e) => { e.preventDefault(); finish(); });
  $("#scrim").addEventListener("mousedown", (e) => { if(e.target.id === "scrim") closeModal(); });
  onMount?.();
  $("#mform input")?.focus();
}

/** Run a save from inside a modal that has no confirm button. */
async function inlineSave(work){
  if(state.busy) return;
  state.busy = true;
  $("#merr").textContent = "";
  try { await work(); }
  catch (error) { $("#merr").textContent = error.message; }
  finally { state.busy = false; }
}

const roleOptions = (current) =>
  ["admin","finance","member"].map(r => `<option value="${r}"${r === current ? " selected" : ""}>${roleLabel(r)}</option>`).join("");

const permBoxes = (perms = {}) => `<div class="perms">${
  PERMS.map(p => `<label><input type="checkbox" data-perm="${p}"${perms[p] ? " checked" : ""}> ${p}</label>`).join("")
}</div>`;

const readPerms = () => Object.fromEntries(
  [...document.querySelectorAll("[data-perm]")].map(el => [el.dataset.perm, el.checked])
);

const familyRoleOptions = (current) => FAMILY_ROLES
  .map(r => `<option value="${r.value}"${(current || "") === r.value ? " selected" : ""}>${r.label}</option>`)
  .join("");

/**
 * The household half of a person form: which family, what
 * relationship, and the option to start a family on the spot so
 * placing someone never means leaving the form first.
 */
const familyFields = (user = {}) => !familiesReady ? "" : `
  <div class="pair">
    <div class="field">
      <label for="f_family">Family</label>
      <select id="f_family">
        <option value="">— No family —</option>
        ${families.map(f => `<option value="${esc(f.id)}"${user.family_id === f.id ? " selected" : ""}>${esc(f.name)}</option>`).join("")}
        <option value="__new">＋ New family…</option>
      </select>
    </div>
    <div class="field">
      <label for="f_famrole">Relationship</label>
      <select id="f_famrole">${familyRoleOptions(user.family_role)}</select>
    </div>
  </div>
  <div class="field" id="f_newfam_wrap" hidden>
    <label for="f_newfam">New family name</label>
    <input id="f_newfam" placeholder="Ortega">
    <div class="hint">Created when you save, with this person as its first member.</div>
  </div>`;

/** Show the name box only while "New family…" is chosen. */
function mountFamilyFields(){
  const select = $("#f_family");
  if(!select) return;
  const sync = () => { $("#f_newfam_wrap").hidden = select.value !== "__new"; };
  select.addEventListener("change", sync);
  sync();
}

/**
 * The household half of a save, as the function wants it.
 *
 * A brand new family travels as a name rather than being created
 * here first: one request then either places the person in a new
 * household or leaves nothing behind, instead of stranding an
 * empty family when the account save is the thing that fails.
 *
 * Returns nothing at all when the form had no household fields —
 * either the picker isn't on this form, or the families migration
 * hasn't run and `family_id` is not a column yet.
 */
function householdPayload(){
  if(!familiesReady || !$("#f_family")) return {};

  const value = $("#f_family").value;
  const familyRole = $("#f_famrole").value || null;

  if(value === "__new"){
    const name = $("#f_newfam").value.trim();
    if(!name) throw new Error("Name the new family, or pick an existing one.");
    return { familyName: name, familyRole };
  }

  return { familyId: value || null, familyRole: value ? familyRole : null };
}

function requireLive(){
  if(!live) throw new Error("Demo mode — connect Supabase to make changes stick.");
}

      <div class="field"><label for="f_role">Role</label><select id="f_role">${roleOptions("member")}</select>

  openModal({
    title: `Household for ${user.full_name || user.email}`,
    sub: current
      ? `Currently with the ${esc(current.name)} family. Moving them takes their giving history along — nothing is rewritten.`

    fields: familyFields(user),

      await setUserFamily(user.id, household);
      toast(household.familyId || household.familyName ? "Household updated." : "Removed from the household.");
      await refresh();

function toggleActive(user){
  const active = user.is_active !== false;
  openModal({
    title: active ? "Deactivate this account?" : "Restore this account?",
    sub: active
      ? `${esc(user.full_name || user.email)} will no longer be able to sign in. Their giving and expense history stays exactly as it is.`
      : `${esc(user.full_name || user.email)} will be able to sign in again.`,
    fields: "",
    confirmText: active ? "Deactivate" : "Restore",
    danger: active,
    onConfirm: async () => {
      requireLive();
      await setUserActive(user.id, !active);
      toast(active ? "Account deactivated." : "Account restored.");
      await refresh();
    },
  });
}

function removePerson(user){
  let force = false;
  openModal({
    title: "Delete this account?",
    sub: `This permanently removes ${esc(user.full_name || user.email)}. Deactivating is usually the better choice — it blocks sign-in while keeping the books intact.`,
    fields: "",
    confirmText: "Delete permanently",
    danger: true,
    onConfirm: async () => {
      requireLive();
      try {
        await deleteUser(user.id, { force });
      } catch (error) {
        /* The function refuses the first time when the person appears
           in the books; a second confirm forces it through. */
        if(!force && /financial record/i.test(error.message)){
          force = true;
          $("#mok").textContent = "Delete anyway";
          throw error;
        }
        throw error;
      }
      toast("Account deleted.");
      await refresh();
    },
  });
}

/**
 * Add, remove, and re-label the people in a household.
 *
 * Every control here saves on the spot and redraws the list, so
 * there is no half-applied state to reconcile if the modal is
 * closed midway.
 */
function manageMembers(family){
  const body = () => {
    /* refresh() replaces the families array, so re-resolve rather
       than reading a snapshot taken before the last save. */
    const current = familyById(family.id) || family;
    const members = membersOf(family.id);
    const candidates = users
      .filter(u => u.family_id !== family.id && u.is_active !== false)
      .sort((a, b) => String(a.full_name || "").localeCompare(String(b.full_name || "")));

    return `
      ${members.length ? `<div class="mlist">${members.map(m => `
        <div class="mrow">
          <div class="av" style="background:${avColor(m.full_name)};width:28px;height:28px;font-size:11px">${esc(initials(m.full_name))}</div>
          <div class="grow">
            <div class="nm" style="font-size:14px">${esc(m.full_name || m.email)}${current.primary_contact_id === m.id ? ' <span class="tag member">contact</span>' : ""}</div>
            <div class="em">${esc(m.email || "")}</div>
          </div>
          <select data-role-for="${esc(m.id)}" aria-label="Relationship">${familyRoleOptions(m.family_role)}</select>
          <button type="button" class="x" data-remove="${esc(m.id)}">Remove</button>
        </div>`).join("")}</div>`
        : `<p class="sub">Nobody is in this family yet.</p>`}

      <div class="field">
        <label for="mm_add">Add someone</label>
        <select id="mm_add">
          <option value="">Choose a person…</option>
          ${candidates.map(u => {
            const from = familyById(u.family_id);
            return `<option value="${esc(u.id)}">${esc(u.full_name || u.email)}${from ? ` — moving from ${esc(from.name)}` : ""}</option>`;
          }).join("")}
        </select>
        <div class="hint">Someone already in another household is moved, not copied.</div>
      </div>
      <button class="btn" type="button" id="mm_addbtn">Add to family</button>`;
  };

  const mount = () => {
    $("#mform").innerHTML = body();

    $("#mm_addbtn").addEventListener("click", () => inlineSave(async () => {
      const id = $("#mm_add").value;
      if(!id) throw new Error("Choose someone to add.");
      requireLive();
      await setUserFamily(id, { familyId: family.id });
      await refresh();
      toast("Added to the family.");
      mount();
    }));

    for(const select of document.querySelectorAll("[data-role-for]")){
      select.addEventListener("change", () => inlineSave(async () => {
        requireLive();
        await setUserFamily(select.dataset.roleFor, { familyId: family.id, familyRole: select.value || null });
        await refresh();
        toast("Relationship saved.");
        mount();
      }));
    }

    for(const button of document.querySelectorAll("[data-remove]")){
      button.addEventListener("click", () => inlineSave(async () => {
        requireLive();
        await setUserFamily(button.dataset.remove, { familyId: null });
        await refresh();
        toast("Removed from the family.");
        mount();
      }));
    }
  };

  openModal({
    title: `The ${family.name} family`,
    sub: "Changes here save as you make them. Removing someone keeps their account and their giving history — it only ends the grouping.",
    fields: "",
    onMount: mount,
  });
}

function removeFamily(family){

    sub: members.length

      : "This household has no members, so nothing else changes.",

$("#rows").addEventListener("click", (e) => {
  const button = e.target.closest("button"); if(!button) return;
  const id = button.dataset.edit || button.dataset.pw || button.dataset.fam || button.dataset.active || button.dataset.del;
  const user = users.find(u => u.id === id); if(!user) return;

  if(button.dataset.edit) return editPerson(user);
  if(button.dataset.pw) return changePassword(user);
  if(button.dataset.fam) return assignFamily(user);
  if(button.dataset.active) return toggleActive(user);
  if(button.dataset.del) return removePerson(user);
});

$("#frows").addEventListener("click", (e) => {
  const button = e.target.closest("button"); if(!button) return;
  const id = button.dataset.fedit || button.dataset.fmembers || button.dataset.fdel;
  const family = familyById(id); if(!family) return;

  if(button.dataset.fedit) return editFamily(family);
  if(button.dataset.fmembers) return manageMembers(family);
  if(button.dataset.fdel) return removeFamily(family);
});

for(const tab of document.querySelectorAll("[data-tab]")){
  tab.addEventListener("click", () => { state.tab = tab.dataset.tab; render(); });
}

$("#btnAdd").addEventListener("click", () => state.tab === "people" ? addPerson() : addFamily());
$("#btnSignOut").addEventListener("click", () => signOut());
$("#q").addEventListener("input", (e) => { state.q = e.target.value; renderPeople(); });
$("#fq").addEventListener("input", (e) => { state.fq = e.target.value; renderFamilies(); });
$("#filterRole").addEventListener("change", (e) => { state.role = e.target.value; renderPeople(); });
$("#filterStatus").addEventListener("change", (e) => { state.status = e.target.value; renderPeople(); });
$("#filterFamily").addEventListener("change", (e) => { state.family = e.target.value; renderPeople(); });
document.addEventListener("keydown", (e) => { if(e.key === "Escape" && state.modal) closeModal(); });

/* ---------------- boot ---------------- */
async function refresh(){
  const data = await listUsers();
  users = data.users;
  families = data.families;
  callerId = data.callerId;
  familiesReady = !data.familiesError;

  /* People still load when the families migration hasn't run — and
     keep working, because the household fields come off the forms
     rather than writing columns that aren't there. Say so once, in
     the banner, rather than failing the whole page. */
  if(data.familiesError){
    $("#banner").hidden = false;
    $("#banner").textContent =
      `Families are unavailable: ${data.familiesError}. Apply supabase/migrations to add the families table — ` +
      `accounts, passwords, and permissions all work meanwhile.`;
  }

  render();
}

async function start(){
  if(!isConfigured){
    users = DEMO_USERS;
    families = DEMO_FAMILIES;
    callerId = "p1";
    live = false;
    render();
    $("#banner").hidden = false;
    $("#banner").textContent = "Demo mode — this is sample data. Connect Supabase in .env to manage real accounts.";
    return showModeBadge({ mode:"demo", portal:"Admin" });
  }

  const session = await requireSession({ adminOnly:true });
  if(!session) return;           /* redirected or gated */

  try {
    live = true;
    await refresh();
    showModeBadge({ mode:"ready", portal:"Admin" });
  } catch (error) {
    live = false;
    $("#banner").hidden = false;
    $("#banner").textContent = error.message;
    showModeBadge({ mode:"error", portal:"Admin", error:error.message });
  }
}

await start();
</script>
</body>
</html>
