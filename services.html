<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somos Reino — services &amp; scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#F7746D;
  --coral-deep:#C8483F;
  --coral-wash:#FDECEA;
  --ink:#17151C;
  --ink-2:#221F29;
  --ink-3:#332F3C;
  --paper:#FAF7F5;
  --card:#FFFFFF;
  --line:#E9E2DD;
  --line-2:#D8CFC8;
  --text:#1E1B22;
  --text-2:#6A6371;
  --text-3:#9A9299;
  --sage:#3F7A63;
  --sage-wash:#E7F1EC;
  --amber:#A97613;
  --amber-wash:#FBF0DC;
  --blue:#2F6E8F;
  --blue-wash:#E6F0F5;
  --plum:#8A4A6B;
  --r:10px;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ui:"Schibsted Grotesk",system-ui,sans-serif;
  --display:"Bricolage Grotesque","Schibsted Grotesk",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ui);
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.45;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:236px;flex:0 0 236px;background:var(--ink);color:#EDE8EA;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;color:inherit;text-decoration:none}
.brand:hover .brand-name{color:var(--coral)}
.nav-extra{margin-top:6px;padding-top:10px;border-top:1px solid #302C38}
.nav-item[href]{text-decoration:none}
.brand svg{width:26px;height:26px;display:block}
.brand-name{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.03em;white-space:nowrap}
.brand-sub{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#7E7686;margin-top:1px}
.org{margin:0 12px 14px;padding:9px 11px;border:1px solid #302C38;border-radius:8px;display:flex;align-items:center;gap:9px}
.org-mark{padding:3px 6px;border-radius:5px;background:var(--coral);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:9px;letter-spacing:.08em;color:#3A100D;flex:0 0 auto}
.org-name{font-size:12.5px;font-weight:600;line-height:1.2}
.org-meta{font-family:var(--mono);font-size:9px;color:#7E7686;letter-spacing:.06em}
.nav{padding:4px 12px;display:flex;flex-direction:column;gap:1px}
.nav-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:#5F5869;text-transform:uppercase;padding:14px 9px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;
  color:#B7B0BD;font-size:13.5px;font-weight:500;width:100%;text-align:left;position:relative;
  transition:background .13s,color .13s;
}
.nav-item:hover{background:#221F29;color:#EDE8EA}
.nav-item[aria-current="true"]{background:var(--ink-3);color:#fff}
.nav-item[aria-current="true"]::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;background:var(--coral);border-radius:0 3px 3px 0}
.nav-ico{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-count{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--coral);color:#3A100D;padding:1px 5px;border-radius:20px;font-weight:600}
.nav-count.quiet{background:#302C38;color:#9A9299}
.rail-foot{margin-top:auto;padding:14px 12px 16px;border-top:1px solid #262230}
.me{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;width:100%;text-align:left}
.me:hover{background:#221F29}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:0 0 auto;font-family:var(--ui)}
.avatar.sm{width:22px;height:22px;font-size:9px}
.avatar.lg{width:40px;height:40px;font-size:14px}
.me-name{font-size:12.5px;font-weight:600;color:#EDE8EA}
.me-role{font-family:var(--mono);font-size:9px;color:#7E7686;letter-spacing:.06em;text-transform:uppercase}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:flex-end;gap:16px;padding:24px 32px 18px;
  border-bottom:1px solid var(--line);background:var(--paper);
  position:sticky;top:0;z-index:20;
}
.crumb{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
h1{font-family:var(--display);font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:3px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.view{padding:22px 32px 60px;max-width:1320px}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:7px;
  font-size:13px;font-weight:600;border:1px solid var(--line-2);background:var(--card);color:var(--text);
  transition:background .13s,border-color .13s,transform .08s;
}
.btn:hover{background:#F3EEEB;border-color:#C6BCB4}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--coral);border-color:var(--coral);color:#3A100D}
.btn-primary:hover{background:#F4605A;border-color:#F4605A}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink-3);border-color:var(--ink-3)}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:#EFE9E5;border-color:transparent}
.btn-ok{background:var(--sage);border-color:var(--sage);color:#fff}
.btn-ok:hover{background:#356853;border-color:#356853}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card-hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-title{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.card-bd{padding:16px}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}

.grid{display:grid;gap:14px}
.split{display:grid;gap:14px;grid-template-columns:1.15fr .85fr;align-items:start}
.side{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
.side-lg{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 340px;align-items:start}
.duo{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.stack{display:grid;gap:14px;align-content:start}
.tbl{overflow-x:auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:5px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;white-space:nowrap}
.t-ok{background:var(--sage-wash);color:var(--sage)}
.t-wait{background:var(--amber-wash);color:var(--amber)}
.t-hot{background:var(--coral-wash);color:var(--coral-deep)}
.t-mute{background:#F1ECE9;color:var(--text-2)}
.t-info{background:var(--blue-wash);color:var(--blue)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}

table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);text-align:left;font-weight:500;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid #F2ECE8;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FCFAF9}
.ta-r{text-align:right}
.ta-c{text-align:center}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-2)}
.input,select.input,textarea.input{border:1px solid var(--line-2);border-radius:7px;padding:7px 10px;background:var(--card);font-size:13.5px;width:100%}
.input:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-wash)}
textarea.input{resize:vertical;line-height:1.5}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%236A6371' fill='none' stroke-width='1.5' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}
.input-sm{padding:4px 8px;font-size:12px;border-radius:6px}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 11px;border-radius:20px;border:1px solid var(--line-2);background:var(--card);font-size:12.5px;font-weight:500;color:var(--text-2)}
.pill:hover{border-color:#C6BCB4;color:var(--text)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill .c{font-family:var(--mono);font-size:10.5px;opacity:.65;margin-left:4px}

.empty{padding:36px 20px;text-align:center;color:var(--text-2)}
.empty strong{display:block;font-size:14px;color:var(--text);margin-bottom:3px;font-weight:600}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;text-align:left;width:100%;transition:border-color .13s,transform .1s}
button.tile:hover{border-color:var(--line-2);transform:translateY(-1px)}
.tile-v{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.04em;margin:6px 0 2px}
.tile-note{font-size:11.5px;color:var(--text-2)}
.tile-hot .tile-v{color:var(--coral-deep)}

/* ---------- order of service (signature) ----------
   A four-column rhythm — clock, type, what it is, how long — so a
   volunteer can find their cue by scanning one column. */
.ord-row{
  display:grid;grid-template-columns:58px 20px minmax(0,1fr) auto;gap:11px;align-items:center;
  padding:9px 14px;border-bottom:1px solid #F2ECE8;width:100%;text-align:left;
}
.ord-row:last-child{border-bottom:none}
.ord-row:hover{background:#FCFAF9}
.ord-row[aria-pressed="true"]{background:var(--coral-wash)}
.ord-row.head{background:#F5F0EC;border-bottom:1px solid var(--line)}
.ord-row.head .ord-title{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-2);font-weight:500}
.ord-time{font-family:var(--mono);font-size:11px;color:var(--text-3);letter-spacing:-.02em}
.ord-kind{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:0 0 auto;font-family:var(--mono);font-size:9px;font-weight:600}
.k-song{background:var(--coral-wash);color:var(--coral-deep)}
.k-item{background:#F1ECE9;color:var(--text-2)}
.k-head{background:transparent;color:var(--text-3)}
.ord-title{font-size:13.5px;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord-sub{font-size:11.5px;color:var(--text-2);display:block;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord-len{font-family:var(--mono);font-size:12px;color:var(--text-2);text-align:right;white-space:nowrap}
.keychip{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;background:var(--ink);color:#fff;letter-spacing:.02em}
.ord-tools{display:flex;gap:2px;margin-left:8px}
.icobtn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--text-3);font-family:var(--mono);font-size:12px;line-height:1}
.icobtn:hover{background:#EFE9E5;color:var(--text)}
.lenbar{display:flex;height:7px;border-radius:4px;overflow:hidden;gap:2px;margin-top:9px}
.lenbar span{transition:flex .3s}

/* ---------- scheduling ---------- */
.pos{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #F2ECE8;flex-wrap:nowrap}
.pos:last-child{border-bottom:none}
.pos>span:nth-child(2){min-width:0;flex:1}
.pos-name{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-role{display:block;font-size:11px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos-open{font-size:12.5px;color:var(--text-3);font-style:italic}
.teamhd{display:flex;align-items:center;gap:8px;padding:12px 0 4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.teamhd::after{content:"";flex:1;height:1px;background:var(--line)}

/* ---------- matrix ---------- */
.mx{border-collapse:separate;border-spacing:0;font-size:12.5px}
.mx th,.mx td{border-bottom:1px solid #F2ECE8;padding:0}
.mx th.date{padding:8px 10px;text-align:center;border-left:1px solid #F2ECE8;min-width:112px}
.mx th.who{padding:8px 14px;position:sticky;left:0;background:var(--card);z-index:2}
.mx td.who{padding:8px 14px;position:sticky;left:0;background:var(--card);z-index:2;border-right:1px solid var(--line)}
.mx tbody tr:hover td.who{background:#FCFAF9}
.cell{width:100%;min-height:46px;padding:6px 8px;text-align:left;border-left:1px solid #F2ECE8;display:block}
.cell:hover{background:#FCFAF9}
.cell .p{display:block;font-size:11.5px;font-weight:600;line-height:1.25}
.cell .s{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.cell.confirmed{background:var(--sage-wash)}
.cell.confirmed .s{color:var(--sage)}
.cell.unconfirmed{background:var(--amber-wash)}
.cell.unconfirmed .s{color:var(--amber)}
.cell.declined{background:var(--coral-wash)}
.cell.declined .s{color:var(--coral-deep)}
.cell.draft{background:#F4F0ED}
.cell.draft .s{color:var(--text-2)}
.cell.blocked{background:repeating-linear-gradient(135deg,#F6F1ED 0 6px,#EFE7E1 6px 12px);color:var(--text-3)}
.cell.blocked .p{font-weight:500;font-style:italic;color:var(--text-3)}

/* ---------- live ---------- */
.live{background:var(--ink);color:#EDE8EA;border-radius:var(--r);padding:22px 24px}
.live-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.live-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;background:var(--coral);color:#3A100D;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.live-badge.off{background:#302C38;color:#9A9299}
.live-grid{display:grid;grid-template-columns:1.4fr .6fr;gap:22px;align-items:center}
.live-eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8B8394}
.live-now{font-family:var(--display);font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:5px 0 6px}
.live-meta{font-size:13px;color:#B7B0BD}
.live-clock{font-family:var(--mono);font-size:clamp(34px,6vw,54px);font-weight:600;letter-spacing:-.05em;line-height:1}
.live-diff{font-family:var(--mono);font-size:13px;margin-top:4px}
.live-track{height:6px;background:#302C38;border-radius:4px;overflow:hidden;margin-top:16px}
.live-fill{height:100%;background:var(--coral);border-radius:4px;transition:width .25s linear}
.live-fill.over{background:var(--amber)}
.live-ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.live-ctl .btn{background:#302C38;border-color:#3D3847;color:#EDE8EA}
.live-ctl .btn:hover{background:#3D3847;border-color:#4A4456}
.live-ctl .btn-primary{background:var(--coral);border-color:var(--coral);color:#3A100D}
.live-ctl .btn-primary:hover{background:#F4605A;border-color:#F4605A}
.live-row{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:11px;align-items:center;padding:8px 14px;border-bottom:1px solid #F2ECE8;width:100%;text-align:left}
.live-row:last-child{border-bottom:none}
.live-row:hover{background:#FCFAF9}
.live-row.now{background:var(--coral-wash)}
.live-row.done{opacity:.55}
.live-row.now .ord-title{color:var(--coral-deep)}

/* ---------- songs & files ---------- */
.songrow{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid #F2ECE8;width:100%;text-align:left}
.songrow:last-child{border-bottom:none}
.songrow:hover{background:#FCFAF9}
.songrow[aria-pressed="true"]{background:var(--coral-wash)}
.file{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F2ECE8}
.file:last-child{border-bottom:none}
.ftype{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-size:8.5px;font-weight:600;flex:0 0 auto;letter-spacing:.04em}
.f-pdf{background:var(--coral-wash);color:var(--coral-deep)}
.f-mp3{background:var(--blue-wash);color:var(--blue)}
.f-img{background:var(--sage-wash);color:var(--sage)}
.f-doc{background:var(--amber-wash);color:var(--amber)}
.seq{display:flex;gap:4px;flex-wrap:wrap}
.seq span{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;background:#F1ECE9;color:var(--text-2)}
.seq span.c{background:var(--coral-wash);color:var(--coral-deep)}

/* ---------- misc blocks ---------- */
.prow{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid #F2ECE8;width:100%;text-align:left}
.prow:last-child{border-bottom:none}
.prow:hover{background:#FCFAF9}
.prow[aria-pressed="true"]{background:var(--coral-wash)}
.prow-name{display:block;font-size:13.5px;font-weight:600}
.prow-sub{display:block;font-size:11.5px;color:var(--text-2)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #F2ECE8;font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-2)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.att{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid #F2ECE8;width:100%;text-align:left}
.att:last-child{border-bottom:none}
.att:hover{background:#FCFAF9}
.att-bar{width:3px;align-self:stretch;border-radius:2px;flex:0 0 auto}
.att-t{display:block;font-size:13.5px;font-weight:600}
.att-d{display:block;font-size:11.5px;color:var(--text-2);margin-top:1px}
.att-go{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.sw-toggle{margin-left:auto;width:36px;height:20px;border-radius:12px;background:#DDD5CF;position:relative;flex:0 0 auto;transition:background .16s}
.sw-toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw-toggle[aria-pressed="true"]{background:var(--sage)}
.sw-toggle[aria-pressed="true"]::after{transform:translateX(16px)}
.bars{display:flex;align-items:flex-end;gap:5px;height:74px}
.bars .b{flex:1;background:var(--coral);opacity:.85;border-radius:2px 2px 0 0;min-height:2px}
.bars .b.pale{background:#E9DFDA}

/* ---------- modal + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(23,21,28,.42);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(23,21,28,.28);overflow:hidden}
.modal.wide{max-width:620px}
.modal-hd{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.modal-t{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.03em}
.modal-d{font-size:12.5px;color:var(--text-2);margin-top:3px}
.modal-bd{padding:18px 20px;display:flex;flex-direction:column;gap:13px;max-height:60vh;overflow:auto}
.modal-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#FCFAF9}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,14px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;z-index:80;transition:opacity .2s,transform .2s;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:min(520px,calc(100vw - 32px))}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .tick{color:var(--coral);font-family:var(--mono)}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .split,.side,.side-lg,.duo{grid-template-columns:minmax(0,1fr)}
  .live-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .tiles{grid-template-columns:1fr}
  .ord-row{grid-template-columns:50px 20px minmax(0,1fr)}
  .ord-len{grid-column:3;text-align:left}
}
@media (max-width:900px){
  .shell{flex-direction:column}
  .rail{width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;gap:4px;padding-right:10px}
  .brand{padding:14px}
  .brand-sub,.org,.rail-foot,.nav-eyebrow{display:none}
  .nav{flex-direction:row;padding:0;gap:2px}
  .nav-extra{margin:0 0 0 6px;padding:0 0 0 8px;border-top:0;border-left:1px solid #302C38;flex:0 0 auto}
  .nav-extra .nav-item{white-space:nowrap}
  .nav-item{white-space:nowrap}
  .nav-item[aria-current="true"]::before{display:none}
  .topbar{padding:16px 18px 14px}
  .view{padding:16px 18px 50px}
  h1{font-size:22px}
  /* Grid and flex children default to min-width:auto, so a wide table
     stops its card from shrinking and drags the page sideways. */
  .grid,.split,.side,.side-lg,.duo,.stack,.card{min-width:0}
  .tbl{max-width:100%}
}
/* Touch sizing. The page is dense on purpose and a mouse works it
   comfortably, so grow the controls only for fingers. */
@media (max-width:900px),(pointer:coarse){
  .nav-item{min-height:44px}
  .btn{min-height:44px}
  .btn-sm{min-height:44px;padding:8px 12px}
  .pill{min-height:44px}
  .icobtn{width:40px;height:40px}
  .input,select.input,textarea.input{min-height:44px;font-size:16px} /* 16px stops iOS zooming on focus */
  .input-sm{min-height:40px;font-size:16px}
  textarea.input{min-height:88px}
  .sw-toggle::before{content:"";position:absolute;top:50%;left:50%;width:44px;height:44px;transform:translate(-50%,-50%)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
@media print{
  .rail,.topbar-actions,.ord-tools,.icobtn{display:none !important}
  .view{padding:0;max-width:none}
  .card{break-inside:avoid}
}

   media, templates, a live service clock, and the reports a
   church actually files (CCLI usage, who is serving too often).

   Everything here runs on in-memory sample data. There are no
   services tables in the Supabase schema yet, so the page gates
   on a session like the other portals but always reports "demo"
   in the status badge — that badge answers "am I looking at real
   data", and the honest answer for this page is no.
   ============================================================ */

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials = n => String(n).trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const AV = ["#F7746D","#3F7A63","#A97613","#5B5470","#2F6E8F","#8A4A6B","#4C6B3F"];
const avColor = n => AV[[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%AV.length];

/* Lengths are seconds everywhere — an order of service is planned in
   minutes and seconds, and a plan that drifts 40 seconds an item is
   how a service runs ten minutes long. */
const mmss = s => `${Math.floor(Math.abs(s)/60)}:${String(Math.round(Math.abs(s)%60)).padStart(2,"0")}`;
const signed = s => (s<0?"−":"+") + mmss(s);
const hhmm = mins => {
  const m = ((Math.round(mins)%1440)+1440)%1440, h = Math.floor(m/60), am = h<12;
  return `${((h+11)%12)+1}:${String(m%60).padStart(2,"0")} ${am?"AM":"PM"}`;
};
/* "5:20" and "5" both mean the same thing to whoever is typing. */
const parseLen = v => {
  const t = String(v).trim();
  if(!t) return 0;
  const [a,b] = t.split(":");
  return b === undefined ? Math.round(parseFloat(a||"0")*60) : (parseInt(a||"0",10)*60 + parseInt(b||"0",10));
};
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* Dates are plain YYYY-MM-DD. Parsing them at noon keeps a timezone
   west of UTC from rendering Sunday's plan as Saturday. */
const asDate = iso => new Date(iso + "T12:00:00");
const dayName = iso => DAYS[asDate(iso).getDay()];
const shortDate = iso => `${MONTHS[asDate(iso).getMonth()]} ${asDate(iso).getDate()}`;
const longDate = iso => `${DAYS[asDate(iso).getDay()]}, ${MONTHS[asDate(iso).getMonth()]} ${asDate(iso).getDate()}`;

/* The sample data is built around a Sunday so the live view has a

/* ---------------- service types ---------------- */

/* Open slots = what the service type asks for, minus what is filled.
   A decline reopens the slot, which is the whole point of tracking it. */
function openSlots(planId){
  const plan = planOf(planId);
  if(!plan) return [];
  const filled = new Map();
  for(const a of schedFor(planId)){
    if(a.status==="declined") continue;
    const k = a.team+"|"+a.position;
    filled.set(k,(filled.get(k)||0)+1);
  }
  const out = [];
  for(const [team,position] of (NEEDS[plan.type]||[])){
    const k = team+"|"+position;
    const left = (filled.get(k)||0);
    if(left>0){ filled.set(k,left-1); continue; }
    out.push({team,position});
  }
  return out;
}
const unconfirmedFor = planId => schedFor(planId).filter(a=>a.status==="unconfirmed").length;

    else acc.other += i.len;
    return acc;
  },{song:0,word:0,other:0});
  const total = buckets.song+buckets.word+buckets.other || 1;
  return `<div class="lenbar">
      <span style="flex:${buckets.song};background:var(--coral)" title="Music ${mmss(buckets.song)}"></span>
      <span style="flex:${buckets.word};background:var(--ink)" title="Teaching ${mmss(buckets.word)}"></span>
      <span style="flex:${buckets.other};background:#D8CFC8" title="Everything else ${mmss(buckets.other)}"></span>
    </div>
    <div class="row" style="gap:14px;margin-top:8px;font-size:11.5px;color:var(--text-2)">
      <span><b class="num">${mmss(buckets.song)}</b> music</span>
      <span><b class="num">${mmss(buckets.word)}</b> teaching</span>
      <span><b class="num">${mmss(buckets.other)}</b> everything else</span>
      <span style="margin-left:auto" class="num">${Math.round(total/60)} min total</span>
    </div>`;
}

/* Every song scheduled anywhere, counted — the spine of both the CCLI
   report and "have we sung this three weeks running?". */
function songUsage(){
  const counts = new Map();
  for(const p of plans){
    for(const i of p.items){
      if(i.kind!=="song" || !i.songId) continue;
      const row = counts.get(i.songId) || {songId:i.songId, title:songOf(i.songId)?.title || i.title, count:0, dates:[], keys:new Set()};
      row.count++;
      row.dates.push(p.date);
      row.keys.add(i.key || songOf(i.songId)?.key || "");
      counts.set(i.songId,row);
    }
  }
  return [...counts.values()].sort((a,b)=>b.count-a.count || a.title.localeCompare(b.title));
}
const lastScheduled = songId => {
  const dates = plans.filter(p=>p.items.some(i=>i.songId===songId)).map(p=>p.date).sort();
  return dates.length ? dates[dates.length-1] : null;
};

/* ---------------- view: plan (signature) ----------------
   The order of service on the left with a running clock, the person
   for every position on the right. Selecting an item opens the notes
   each position reads on Sunday. */
function viewPlan(){
  const p = planOf(state.planId);
  if(!p) return `<div class="card"><div class="empty"><strong>That plan is gone</strong>Pick another from the plans list.</div></div>`;

  let clock = p.start*60;
  const rows = p.items.map(i=>{
    const at = clock;
    clock += i.len;
    if(i.kind==="header"){
      return `<div class="ord-row head">
        <span class="ord-time"></span><span class="ord-kind k-head">§</span>
        <span><span class="ord-title">${esc(i.title)}</span></span>
        <span class="ord-len"></span>
      </div>`;
    }
    const s = i.songId ? songOf(i.songId) : null;
    const sub = [
      i.who ? personName(i.who) : "",
      s ? `${esc(i.arr||"")} · ${s.bpm} bpm · ${esc(s.meter)}` : esc(i.desc||""),
      [i.notes.media,i.notes.audio,i.notes.host].filter(Boolean).length ? `${[i.notes.media,i.notes.audio,i.notes.host].filter(Boolean).length} note(s)` : "",

    return `<button class="ord-row" data-item="${i.id}" aria-pressed="${state.itemId===i.id}">

const fileExt = name => (name.split(".").pop()||"file").toUpperCase().slice(0,4);
const fileClass = name => {
  const e = (name.split(".").pop()||"").toLowerCase();
  if(e==="pdf") return "f-pdf";
  if(["mp3","wav","m4a"].includes(e)) return "f-mp3";
  if(["png","jpg","jpeg","mp4","mov"].includes(e)) return "f-img";
  return "f-doc";
};

/* ---------------- view: live ----------------
   Services LIVE: one item at a time, a clock that counts the item
   rather than the service, and the difference from plan in a colour
   you can read from the back of the room. */
const playable = plan => plan.items.filter(i=>i.kind!=="header");

function viewLive(){
  const p = planOf(live.planId) || upcoming()[0];
  if(!p) return `<div class="card"><div class="empty"><strong>No plan to run</strong>Create a plan first.</div></div>`;
  live.planId = p.id;

  const items = playable(p);
  const cur = items[live.idx];
  const next = items[live.idx+1];
  const planned = cur ? cur.len : 0;
  const diff = live.elapsed - planned;
  const pct = planned ? Math.min(100,(live.elapsed/planned)*100) : 0;
  const runTotal = items.reduce((s,i)=>s+i.len,0);

  let clock = p.start*60;
  const list = items.map((i,idx)=>{
    const at = clock; clock += i.len;
    const actual = live.actual[i.id];
    return `<button class="live-row ${idx===live.idx?"now":idx<live.idx?"done":""}" data-liveto="${idx}">
      <span class="ord-time">${hhmm(at/60)}</span>
      <span style="min-width:0">
        <span class="ord-title">${esc(i.title)} ${i.key?`<span class="keychip">${esc(i.key)}</span>`:""}</span>
        <span class="ord-sub">${i.who?esc(personName(i.who)):"—"}${actual!==undefined?` · ran ${mmss(actual)} (${signed(actual-i.len)})`:""}</span>
      </span>
      <span class="ord-len">${mmss(i.len)}</span>
    </button>`;
  }).join("");

  return `
  <div class="grid">
    <div class="live">
      <div class="live-top">
        <span class="live-badge${live.running?"":" off"}"><span class="dot"></span>${live.running?"On air":"Standing by"}</span>
        <span class="live-eyebrow">${esc(typeOf(p.type).name)} · ${longDate(p.date)} · service ${hhmm(p.start)}</span>
        <span class="live-eyebrow" style="margin-left:auto">Item ${Math.min(live.idx+1,items.length)} of ${items.length}</span>
      </div>
      <div class="live-grid">
        <div>
          <div class="live-eyebrow">On now</div>
          <div class="live-now">${cur?esc(cur.title):"Service complete"}${cur&&cur.key?` <span class="keychip" style="font-size:14px;vertical-align:middle">${esc(cur.key)}</span>`:""}</div>
          <div class="live-meta">${cur ? `${cur.who?esc(personName(cur.who)):"Unassigned"} · planned length ${mmss(cur.len)}${cur.arr?` · ${esc(cur.arr)}`:""}` : "Every item has been run."}</div>
          <div class="live-meta" style="margin-top:8px;color:#8B8394">Up next — ${next?esc(next.title):"nothing, that's the end"}</div>
        </div>
        <div style="text-align:right">
          <div class="live-eyebrow">This item</div>
          <div class="live-clock" id="liveElapsed">${mmss(live.elapsed)}</div>
          <div class="live-diff" id="liveDiff" style="color:${diff>0?"#E8A33D":"#8B8394"}">${diff>0?`over by ${mmss(diff)}`:`${mmss(Math.max(0,planned-live.elapsed))} left`}</div>
          <div class="live-eyebrow" style="margin-top:10px">Service total <span class="num" id="liveTotal" style="color:#EDE8EA">${mmss(live.total)}</span> / ${mmss(runTotal)}</div>
        </div>
      </div>
      <div class="live-track"><div class="live-fill${diff>0?" over":""}" id="liveFill" style="width:${pct}%"></div></div>
      <div class="live-ctl">
        <button class="btn btn-primary" data-live="${live.running?"pause":"start"}">${live.running?"Pause":"Start"}</button>
        <button class="btn" data-live="prev">← Previous</button>
        <button class="btn" data-live="next">Next item →</button>
        <button class="btn" data-live="reset">Reset</button>
        <button class="btn" data-act="message" style="margin-left:auto">Message the team</button>
      </div>
    </div>

    <div class="side">
      <div class="card">
        <div class="card-hd"><span class="card-title">Running order</span><span class="eyebrow" style="margin-left:auto">Tap a line to jump</span></div>
        ${list}
      </div>
      <div class="stack">
        <div class="card">
          <div class="card-hd"><span class="card-title">Running this service</span></div>
          <div class="card-bd" style="padding:6px 16px 12px">
            ${["production","pastoral","worship"].flatMap(t=>schedFor(p.id).filter(a=>a.team===t && a.status!=="declined")).slice(0,8).map(a=>`
              <div class="file" style="border-bottom:1px solid #F2ECE8">
                ${avatarFor(a.personId,"sm")}
                <span style="min-width:0"><span class="prow-name" style="font-size:12.5px">${esc(personName(a.personId))}</span><span class="prow-sub">${esc(a.position)}</span></span>
              </div>`).join("")}
          </div>
        </div>
        <div class="card">
          <div class="card-hd"><span class="card-title">Which plan</span></div>
          <div class="card-bd">
            <select class="input input-sm" data-liveplan>
              ${plans.filter(x=>!isPast(x.date)).map(x=>`<option value="${x.id}" ${x.id===live.planId?"selected":""}>${esc(typeOf(x.type).name)} · ${longDate(x.date)}</option>`).join("")}
            </select>
            <div style="font-size:11.5px;color:var(--text-2);margin-top:9px">Switching plans resets the clock. Actual times are kept per plan for the length report.</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

        <span class="row" style="gap:5px"><span style="width:10px;height:10px;border-radius:3px;background:var(--amber-wash);border:1px solid #E8D5A8"></span>Waiting</span>

          <div class="card-hd"><span class="card-title">Where it has been sung</span></div>

            ${history.map(p=>{
              const i = p.items.find(x=>x.songId===s.id);
              return `<div class="kv"><span class="k">${shortDate(p.date)} · ${esc(typeOf(p.type).name)}</span><span class="v">${esc(i.key||s.key)}</span></div>`;

          </div>

  </div>`;
}

/* ---------------- view: reports ---------------- */
function viewReports(){
  const tabs = [["ccli","CCLI usage"],["length","Service length"],["load","Volunteer load"]];
  const usage = songUsage();

  const ccli = `
    <div class="card">
      <div class="card-hd"><span class="card-title">CCLI song usage</span><span class="eyebrow" style="margin-left:auto">Every song scheduled across ${plans.length} plans</span></div>
      <div class="tbl"><table>
        <thead><tr><th>Song</th><th>CCLI</th><th>Author</th><th>Keys used</th><th class="ta-r">Times</th><th class="ta-r">Dates</th></tr></thead>
        <tbody>
          ${usage.map(u=>{
            const s = songOf(u.songId);
            return `<tr>
              <td><b>${esc(u.title)}</b></td>
              <td class="num">${esc(s?.ccli||"—")}</td>
              <td style="font-size:12.5px;color:var(--text-2)">${esc(s?.author||"—")}</td>
              <td>${[...u.keys].filter(Boolean).map(k=>`<span class="keychip" style="margin-right:3px">${esc(k)}</span>`).join("")}</td>
              <td class="ta-r num">${u.count}</td>
              <td class="ta-r" style="font-size:11.5px;color:var(--text-2)">${u.dates.sort().map(shortDate).join(", ")}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table></div>
      <div class="card-bd" style="border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm btn-primary" data-act="submitCcli">Submit to CCLI SongSelect</button>
        <button class="btn btn-sm" data-act="export">Export CSV</button>
      </div>
    </div>`;

  const done = plans.filter(p=>isPast(p.date) || p.actual).sort((a,b)=>b.date.localeCompare(a.date));
  const maxLen = Math.max(...plans.map(p=>Math.max(planLength(p), p.actual||0)), 1);
  const length = `
    <div class="split">
      <div class="card">
        <div class="card-hd"><span class="card-title">Planned against actual</span><span class="eyebrow" style="margin-left:auto">Minutes</span></div>
        <div class="tbl"><table>
          <thead><tr><th>Service</th><th>Planned</th><th>Actual</th><th class="ta-r">Difference</th></tr></thead>
          <tbody>
            ${done.map(p=>{
              const planned = planLength(p), actual = p.actual || planned, d = actual-planned;
              return `<tr>
                <td><b>${esc(typeOf(p.type).name)}</b><div style="font-size:11.5px;color:var(--text-2)">${longDate(p.date)} · ${esc(p.series)}</div></td>
                <td class="num">${mmss(planned)}</td>
                <td class="num">${mmss(actual)}</td>
                <td class="ta-r num" style="color:${d>0?"var(--coral-deep)":"var(--sage)"}">${signed(d)}</td>
              </tr>`;
            }).join("") || `<tr><td colspan="4"><div class="empty"><strong>No completed services yet</strong>Run one from the live view and the actuals land here.</div></td></tr>`}
          </tbody>
        </table></div>
      </div>
      <div class="card">
        <div class="card-hd"><span class="card-title">How long services run</span></div>
        <div class="card-bd">
          <div class="bars">
            ${plans.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>{
              const v = p.actual || planLength(p);
              return `<div class="b${p.actual?"":" pale"}" style="height:${(v/maxLen)*100}%" title="${longDate(p.date)} — ${mmss(v)}"></div>`;
            }).join("")}
          </div>
          <div class="row" style="justify-content:space-between;margin-top:8px">
            <span class="eyebrow">${shortDate(plans.slice().sort((a,b)=>a.date.localeCompare(b.date))[0].date)}</span>
            <span class="eyebrow">${shortDate(plans.slice().sort((a,b)=>b.date.localeCompare(a.date))[0].date)}</span>
          </div>
          <div class="kv" style="margin-top:12px"><span class="k">Average planned</span><span class="v">${mmss(plans.reduce((s,p)=>s+planLength(p),0)/plans.length)}</span></div>
          <div class="kv"><span class="k">Longest item across plans</span><span class="v">${mmss(Math.max(...plans.flatMap(p=>p.items.map(i=>i.len))))}</span></div>
          <div class="kv"><span class="k">Music as a share of Sunday</span><span class="v">${Math.round(
            plans.filter(p=>p.type==="sun").reduce((s,p)=>s+p.items.filter(i=>i.kind==="song").reduce((t,i)=>t+i.len,0),0) /
            Math.max(1,plans.filter(p=>p.type==="sun").reduce((s,p)=>s+planLength(p),0)) * 100)}%</span></div>
        </div>
      </div>
    </div>`;

  const loadRows = people.map(p=>{
    const all = sched.filter(a=>a.personId===p.id);
    const served = all.filter(a=>a.status==="confirmed" && isPast(planOf(a.plan).date)).length;
    const ahead = all.filter(a=>!isPast(planOf(a.plan).date) && a.status!=="declined").length;
    const declined = all.filter(a=>a.status==="declined").length;
    const lastDate = all.filter(a=>isPast(planOf(a.plan).date)).map(a=>planOf(a.plan).date).sort().pop();
    return {p, served, ahead, declined, lastDate};
  }).sort((a,b)=>(b.served+b.ahead)-(a.served+a.ahead));

  const load = `
    <div class="card">
      <div class="card-hd"><span class="card-title">Volunteer load</span><span class="eyebrow" style="margin-left:auto">Who is carrying too much, and who was forgotten</span></div>
      <div class="tbl"><table>
        <thead><tr><th>Person</th><th>Asked for</th><th>Served (past)</th><th>Upcoming</th><th>Declines</th><th class="ta-r">Last served</th></tr></thead>
        <tbody>
          ${loadRows.map(r=>`
            <tr>
              <td><span class="row" style="gap:9px;flex-wrap:nowrap">${avatarFor(r.p.id,"sm")}<span><b style="font-size:13px">${esc(r.p.name)}</b><div style="font-size:11.5px;color:var(--text-2)">${esc(r.p.role)}</div></span></span></td>
              <td style="font-size:12.5px;color:var(--text-2)">${esc(r.p.freq)}</td>
              <td class="num">${r.served}</td>
              <td>${r.ahead>2?`<span class="tag t-hot">${r.ahead} ahead</span>`:`<span class="num">${r.ahead}</span>`}</td>
              <td class="num">${r.declined||"—"}</td>
              <td class="ta-r" style="font-size:12px;color:var(--text-2)">${r.lastDate?shortDate(r.lastDate):"Never"}</td>
            </tr>`).join("")}
        </tbody>
      </table></div>
      <div class="card-bd" style="border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" data-act="export">Export roster CSV</button>
        <button class="btn btn-sm" data-act="thankYou">Send a thank-you to everyone who served</button>
      </div>
    </div>`;

  return `
  <div class="grid">
    <div class="pills">
      ${tabs.map(([k,l])=>`<button class="pill" data-reporttab="${k}" aria-pressed="${state.reportTab===k}">${l}</button>`).join("")}
    </div>
    ${state.reportTab==="ccli"?ccli:state.reportTab==="length"?length:load}
  </div>`;
}

        <div style="background:#FBF7F4;border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:12px;color:var(--text-2)">${schedFor(live.planId||state.planId).filter(a=>a.status!=="declined").length} people will get this.</div>`,
      ok:"Send it"
    },
    upload:{
      t:"Upload files", d:"Charts, planning tracks, slides, stage plots — anything the team needs on Sunday.",
      body:`
        <div class="field"><label>Attach to</label><select class="input" id="up_link"><option>Sunday Aug 16</option><option>Series artwork</option><option>Production</option><option>Host Team</option></select></div>
        <div class="field"><label>Files</label><div style="border:1px dashed var(--line-2);border-radius:8px;padding:18px;text-align:center;font-size:12.5px;color:var(--text-2)">Drop files here<br><span style="font-size:11px">PDF, MP3, MP4, Keynote, ProPresenter</span></div></div>`,
      ok:"Upload"
    },
    generic:{ t:m.title||"Coming up next", d:m.desc||"", body:`<div style="font-size:13px;color:var(--text-2)">${esc(m.body||"")}</div>`, ok:"Got it" },
  };

  const cfg = bodies[m.kind] || bodies.generic;
  return `<div class="scrim" data-scrim>
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(cfg.t)}">
      <div class="modal-hd"><div class="modal-t">${cfg.t}</div>${cfg.d?`<div class="modal-d">${esc(cfg.d)}</div>`:""}</div>
      <div class="modal-bd">${cfg.body}</div>
      <div class="modal-ft">
        <button class="btn btn-sm" data-act="closeModal">Cancel</button>
        <button class="btn btn-sm btn-primary" data-act="confirmModal">${cfg.ok}</button>
      </div>
    </div>
  </div>`;
}

/* ---------------- toast ---------------- */
let toastTimer;
function toast(msg){
  const el = $("#toast");
  el.innerHTML = `<span class="tick">✓</span> ${esc(msg)}`;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("on"), 2600);
}

/* ---------------- render ---------------- */
const VIEWS = {dashboard:viewDashboard, plans:viewPlans, plan:viewPlan, live:viewLive, teams:viewTeams,
               matrix:viewMatrix, songs:viewSongs, media:viewMedia, templates:viewTemplates, reports:viewReports};

function render(){
  renderNav();
  const t = TITLES[state.view];
  $("#crumb").textContent = t.c;
  $("#title").textContent = t.t();
  $("#topActions").innerHTML = topActions();
  $("#view").innerHTML = VIEWS[state.view]();
  $("#modalRoot").innerHTML = modalHTML();
  ensureLiveTimer();
}

/* ---------------- live clock ----------------
   The clock runs on wall time, not on ticks, so a backgrounded tab
   comes back with the right number instead of a slow one. */
function absorb(){
  if(live.running && live.startedAt){
    const s = (Date.now()-live.startedAt)/1000;
    live.base += s; live.baseTotal += s; live.startedAt = Date.now();
  }
  live.elapsed = live.base; live.total = live.baseTotal;
}
function paintLive(){
  const el = $("#liveElapsed");
  if(!el) return;
  const p = planOf(live.planId);
  const cur = playable(p)[live.idx];
  const planned = cur ? cur.len : 0;
  const diff = live.elapsed - planned;
  el.textContent = mmss(live.elapsed);
  $("#liveTotal").textContent = mmss(live.total);
  const d = $("#liveDiff");
  d.textContent = diff>0 ? `over by ${mmss(diff)}` : `${mmss(Math.max(0,planned-live.elapsed))} left`;
  d.style.color = diff>0 ? "#E8A33D" : "#8B8394";
  const f = $("#liveFill");
  f.style.width = (planned ? Math.min(100,(live.elapsed/planned)*100) : 0) + "%";
  f.classList.toggle("over", diff>0);
}
function liveTick(){
  if(!live.running) return;
  const s = (Date.now()-live.startedAt)/1000;
  live.elapsed = live.base + s;
  live.total = live.baseTotal + s;
  paintLive();
}
/* Only tick while the live view is on screen and actually running. */
function ensureLiveTimer(){
  const wanted = state.view==="live" && live.running;
  if(wanted && !liveTimer) liveTimer = setInterval(liveTick, 250);
  if(!wanted && liveTimer){ clearInterval(liveTimer); liveTimer = null; }
}
function liveGo(idx){
  const p = planOf(live.planId);
  const items = playable(p);
  absorb();
  const cur = items[live.idx];
  if(cur && live.elapsed>0.5) live.actual[cur.id] = Math.round(live.elapsed);
  live.idx = Math.max(0, Math.min(idx, items.length));
  live.base = 0; live.elapsed = 0;
  /* Running past the last item ends the service and files the actual
     length, which is what the length report reads. */
  if(live.idx>=items.length){
    live.running = false; live.startedAt = null;
    p.actual = Math.round(live.total);
    p.status = "complete";
    toast(`Service complete — ${mmss(live.total)} against ${mmss(planLength(p))} planned`);
  }
}

/* ---------------- events ---------------- */
document.addEventListener("click", e=>{
  const t = e.target.closest(`[data-nav],[data-openplan],[data-golive],[data-item],[data-move],[data-delitem],[data-fill],
    [data-unassign],[data-accept],[data-decline],[data-act],[data-planfilter],[data-planwhen],[data-team],[data-person],
    [data-song],[data-songlang],[data-mediakind],[data-reporttab],[data-usetemplate],[data-dupe],[data-live],[data-liveto],
    [data-cycle],[data-schedule],[data-fillon],[data-scrim]`.replace(/\s+/g,""));
  if(!t) return;

  if(t.hasAttribute("data-scrim")){ if(e.target===t){ state.modal=null; render(); } return; }

  const d = t.dataset;

  /* ---- navigation ---- */
  if(d.nav){ state.view=d.nav; window.scrollTo({top:0}); return render(); }
  if(d.openplan){ state.planId=d.openplan; state.itemId=null; state.view="plan"; window.scrollTo({top:0}); return render(); }
  if(d.golive){
    if(live.planId!==d.golive){ Object.assign(live,{planId:d.golive, idx:0, running:false, startedAt:null, base:0, baseTotal:0, elapsed:0, total:0, actual:{}}); }
    state.view="live"; window.scrollTo({top:0}); return render();
  }

  /* ---- filters and selections ---- */
  if(d.planfilter){ state.planFilter=d.planfilter; return render(); }
  if(d.planwhen){ state.planWhen=d.planwhen; return render(); }
  if(d.team){ state.teamId=d.team; const first=people.find(p=>p.teams.includes(d.team)); if(first) state.personId=first.id; return render(); }
  if(d.person){ state.personId=d.person; return render(); }
  if(d.song){ state.songId=d.song; return render(); }
  if(d.songlang){ state.songLang=d.songlang; return render(); }
  if(d.mediakind){ state.mediaKind=d.mediakind; return render(); }
  if(d.reporttab){ state.reportTab=d.reporttab; return render(); }
  if(d.item){ state.itemId = state.itemId===d.item ? null : d.item; return render(); }

  /* ---- editing the order ---- */
  if(d.move){
    const p = planOf(state.planId);
    const i = p.items.findIndex(x=>x.id===d.mid);
    const j = d.move==="up" ? i-1 : i+1;
    if(i<0 || j<0 || j>=p.items.length) return;
    [p.items[i], p.items[j]] = [p.items[j], p.items[i]];
    return render();
  }
  if(d.delitem){
    const p = planOf(state.planId);
    const item = p.items.find(x=>x.id===d.delitem);
    p.items = p.items.filter(x=>x.id!==d.delitem);
    if(state.itemId===d.delitem) state.itemId=null;
    toast(`Removed ${item?item.title:"the item"} from the order`);
    return render();
  }

  /* ---- scheduling ---- */
  if(d.fill){
    const [team,position] = d.fill.split("|");
    state.modal = {kind:"schedule", planId:state.planId, team, position};
    return render();
  }
  if(d.fillon){
    const [planId,team,position] = d.fillon.split("|");
    state.modal = {kind:"schedule", planId, team, position};
    return render();
  }
  if(d.schedule){
    const [planId,personId] = d.schedule.split("|");
    const open = openSlots(planId)[0];
    state.modal = {kind:"schedule", planId, team:open?.team, position:open?.position, personId};
    return render();
  }
  if(d.unassign){
    const a = sched.find(x=>x.id===d.unassign);
    sched = sched.filter(x=>x.id!==d.unassign);
    if(a) toast(`${personName(a.personId)} taken off ${a.position}`);
    return render();
  }
  if(d.cycle){
    /* Click a matrix cell to walk a request forward without opening
       anything: waiting → confirmed → declined → waiting. */
    const a = sched.find(x=>x.id===d.cycle);
    if(!a) return;
    const order = {draft:"unconfirmed", unconfirmed:"confirmed", confirmed:"declined", declined:"unconfirmed"};
    a.status = order[a.status] || "unconfirmed";
    toast(`${personName(a.personId)} · ${a.position} — ${a.status==="unconfirmed"?"request sent":a.status}`);
    return render();
  }
  if(d.accept){
    const a = sched.find(x=>x.id===d.accept);
    if(a){ a.status="confirmed"; toast(`You're confirmed for ${a.position} on ${shortDate(planOf(a.plan).date)}`); }
    return render();
  }
  if(d.decline){
    const a = sched.find(x=>x.id===d.decline);
    if(a) state.modal={kind:"decline", assignmentId:a.id, label:`${a.position} · ${longDate(planOf(a.plan).date)}`};
    return render();
  }

  /* ---- plans ---- */
  if(d.dupe){
    const src = planOf(d.dupe);
    const copy = structuredClone({...src, notes:{...src.notes}});
    copy.id = "pl_"+Date.now();
    copy.date = nextWeek(src.date);
    copy.status = "draft";
    copy.actual = undefined;
    copy.items = copy.items.map(i=>({...i, id:"i"+(++itemSeq)}));
    plans.push(copy);
    state.planId = copy.id; state.itemId=null; state.view="plan";
    toast(`Duplicated to ${longDate(copy.date)} — the team did not come with it`);
    return render();
  }
  if(d.usetemplate){
    state.modal = {kind:"newPlan", templateId:d.usetemplate};
    return render();
  }

  /* ---- live controls ---- */
  if(d.live){
    if(d.live==="start"){ live.running=true; live.startedAt=Date.now(); }
    else if(d.live==="pause"){ absorb(); live.running=false; live.startedAt=null; }
    else if(d.live==="next"){ liveGo(live.idx+1); }
    else if(d.live==="prev"){ liveGo(live.idx-1); }
    else if(d.live==="reset"){ Object.assign(live,{idx:0,running:false,startedAt:null,base:0,baseTotal:0,elapsed:0,total:0,actual:{}}); toast("Clock reset"); }
    return render();
  }
  if(d.liveto){ liveGo(parseInt(d.liveto,10)); return render(); }

  /* ---- everything reachable by data-act ---- */
  const act = d.act;
  if(act==="closeModal"){ state.modal=null; return render(); }
  if(act==="addSong"){ state.modal={kind:"addSong"}; return render(); }
  if(act==="addItem"){ state.modal={kind:"addItem"}; return render(); }
  if(act==="addHeader"){ state.modal={kind:"addHeader"}; return render(); }
  if(act==="newPlan"){ state.modal={kind:"newPlan"}; return render(); }
  if(act==="addBlockout"){ state.modal={kind:"blockout", personId:ME}; return render(); }
  if(act==="addBlockoutFor"){ state.modal={kind:"blockout", personId:state.personId}; return render(); }
  if(act==="addPerson"){ state.modal={kind:"addPerson"}; return render(); }
  if(act==="trainPerson"){ state.modal={kind:"trainPerson"}; return render(); }
  if(act==="newSong"){ state.modal={kind:"newSong"}; return render(); }
  if(act==="upload"){ state.modal={kind:"upload"}; return render(); }
  if(act==="message"){ state.modal={kind:"message"}; return render(); }
  if(act==="songToPlan"){ state.modal={kind:"songToPlan", songId:d.sid, songTitle:songOf(d.sid)?.title}; return render(); }

  if(act==="sendRequests" || act==="sendAll"){
    const scope = act==="sendAll" ? sched.filter(a=>!isPast(planOf(a.plan).date)) : schedFor(state.planId);
    const drafts = scope.filter(a=>a.status==="draft");
    drafts.forEach(a=>{ a.status="unconfirmed"; });
    toast(drafts.length ? `${drafts.length} request${drafts.length===1?"":"s"} sent by text and email` : "Everyone has already been asked");
    return render();
  }
  if(act==="print"){ window.print(); return; }

  if(act==="confirmModal"){
    const kind = state.modal?.kind;
    const plan = planOf(state.planId);

    if(kind==="addSong"){
      const s = songOf($("#as_song").value);
      const item = it("song", s.title, parseLen($("#as_len").value) || 300,
        {songId:s.id, key:$("#as_key").value, arr:s.arrangements[0].name, who:$("#as_who").value});
      plan.items.push(item);
      state.itemId = item.id;
      toast(`${s.title} added in ${item.key}`);
    } else if(kind==="addItem"){
      const title = $("#ai_title").value.trim();
      if(!title){ toast("Give the item a name"); return; }
      const item = it("item", title, parseLen($("#ai_len").value), {who:$("#ai_who").value, desc:$("#ai_desc").value.trim()});
      plan.items.push(item);
      state.itemId = item.id;
      toast(`${title} added to the order`);
    } else if(kind==="addHeader"){
      const title = $("#ah_title").value.trim() || "Section";
      plan.items.push(it("header", title, 0));
      toast(`${title} added`);
    } else if(kind==="newPlan"){
      const type = $("#np_type").value;
      const date = $("#np_date").value || "2026-09-06";
      const [sh,sm] = ($("#np_start").value||"10:00").split(":").map(Number);
      const [rh,rm] = ($("#np_reh").value||"08:00").split(":").map(Number);
      const tpl = templates.find(x=>x.id===$("#np_tpl").value);
      const created = {
        id:"pl_"+Date.now(), type, date, start:sh*60+sm, rehearsal:rh*60+rm,
        series:$("#np_series").value.trim() || "Untitled plan", status:"draft", target:4500,
        notes:{vision:"",rehearsal:"",kids:"",announcements:""}, files:[],
        items:(tpl?tpl.items:[]).map(([kind,title,len])=>it(kind==="song"?"song":kind, title, len)),
      };
      plans.push(created);
      if(tpl) tpl.uses++;
      state.planId = created.id; state.itemId=null; state.view="plan";
      toast(`${typeOf(type).name} created for ${longDate(date)}`);
    } else if(kind==="schedule"){
      const m = state.modal;
      const personId = $("#sc_person").value;
      const status = $("#sc_status").value;
      const target = planOf(m.planId);
      const block = blockedOn(personId, target.date);
      sched.push({id:"a"+(++asSeq), plan:m.planId, team:m.team||"worship", position:m.position||"Volunteer", personId, status, note:""});
      toast(block
        ? `${personName(personId)} scheduled — heads up, they blocked out ${shortDate(block.from)} (${block.reason})`
        : status==="draft" ? `${personName(personId)} penciled in for ${m.position}` : `Request sent to ${personName(personId)} for ${m.position}`);
    } else if(kind==="decline"){
      const a = sched.find(x=>x.id===state.modal.assignmentId);
      if(a){
        a.status="declined";
        a.note=$("#dc_note").value.trim();
        toast(`Declined — ${a.position} on ${shortDate(planOf(a.plan).date)} is open again`);
      }
    } else if(kind==="blockout"){
      const personId=$("#bo_person").value, from=$("#bo_from").value, to=$("#bo_to").value||$("#bo_from").value;
      if(!from){ toast("Pick a start date"); return; }
      blockouts.push({id:"b"+Date.now(), personId, from, to, reason:$("#bo_reason").value.trim()||"Unavailable"});
      toast(`${personName(personId)} blocked out ${shortDate(from)}${from===to?"":" – "+shortDate(to)}`);
    } else if(kind==="addPerson"){
      const name=$("#ap_name").value.trim(), email=$("#ap_email").value.trim();
      if(!name || !email){ toast("A name and an email are needed"); return; }
      const created={id:"p"+Date.now(), name, role:"Volunteer", email, freq:$("#ap_freq").value,
        can:[$("#ap_pos").value], teams:[state.teamId], since:String(new Date().getFullYear())};
      people.push(created);
      state.personId=created.id;
      toast(`${name} added to ${teamOf(state.teamId).name} — invitation sent`);
    } else if(kind==="trainPerson"){
      const person=personOf(state.personId);
      const pos=$("#tp_pos")?.value;
      if(person && pos && !person.can.includes(pos)){
        person.can.push(pos);
        const team=TEAMS.find(t=>t.positions.includes(pos));
        if(team && !person.teams.includes(team.id)) person.teams.push(team.id);
        toast(`${person.name} can now be scheduled for ${pos}`);
      }
    } else if(kind==="songToPlan"){
      const s=songOf(state.modal.songId);
      const target=planOf($("#sp_plan").value);
      target.items.push(it("song", s.title, parseLen($("#sp_len").value)||300,
        {songId:s.id, key:$("#sp_key").value, arr:s.arrangements[0].name}));
      toast(`${s.title} added to ${longDate(target.date)}`);
    } else if(kind==="newSong"){
      const title=$("#ns_title").value.trim();
      if(!title){ toast("The song needs a title"); return; }
      const created={id:"s"+Date.now(), title, author:$("#ns_author").value.trim()||"Unknown",
        ccli:$("#ns_ccli").value.trim()||"—", key:$("#ns_key").value, bpm:parseInt($("#ns_bpm").value,10)||72,
        meter:"4/4", themes:[], lang:$("#ns_lang").value,
        arrangements:[{name:"Full band", len:300, seq:["Intro","V1","C","V2","C","Out"]}], files:[]};
      songs.push(created);
      state.songId=created.id; state.view="songs";
      toast(`${title} added to the library`);
    } else if(kind==="message"){
      const body=$("#ms_body").value.trim();
      const count=schedFor(live.planId||state.planId).filter(a=>a.status!=="declined").length;
      toast(body ? `Sent to ${count} people` : "Nothing to send — the message was empty");
    } else if(kind==="upload"){
      media.unshift({id:"m"+Date.now(), name:"Uploaded file.pdf", kind:"pdf", size:"1.2 MB",
        owner:ME, added:TODAY, linked:$("#up_link").value});
      toast("Uploaded and attached");
    } else {
      toast("Done");
    }
    state.modal=null;
    return render();
  }

  /* Things a full build owns — said plainly rather than pretended. */
  const blurbs = {
    export:"CSV on its way to your downloads",
    download:`Downloading ${d.name||"the file"}`,
    emailTeam:"Opening the email composer for everyone on this plan",
    submitCcli:"Usage report queued for CCLI SongSelect",
    thankYou:"Thank-you notes queued for everyone who served",
    importSong:"SongSelect import opens in the full build",
    newArrangement:"Arrangement editor opens in the full build",
    newTemplate:"Template builder opens in the full build",
    editTemplate:"Template editor opens in the full build",
    addPosition:"Position editor opens in the full build",
    attach:"File picker opens in the full build",
    me:"Your profile opens in the full build",
  };
  if(blurbs[act]) toast(blurbs[act]);
});

/* Typing in the song search re-renders, so the caret has to be put back. */
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.hasAttribute("data-songq")){
    state.songQ = t.value;
    const pos = t.selectionStart;
    render();
    const el = $("[data-songq]");
    if(el){ el.focus(); el.setSelectionRange(pos,pos); }
  }
});

document.addEventListener("change", e=>{
  const t = e.target, d = t.dataset;
  const plan = planOf(state.planId);
  const item = id => plan?.items.find(i=>i.id===id);

  if(d.len){ const i=item(d.len); if(i){ i.len=parseLen(t.value); toast(`${i.title} is now ${mmss(i.len)}`); } return render(); }
  if(d.who){ const i=item(d.who); if(i){ i.who=t.value; } return render(); }
  if(d.key){ const i=item(d.key); if(i){ i.key=t.value; toast(`${i.title} in ${t.value}`); } return render(); }
  if(d.arr){
    const i=item(d.arr);
    if(i){
      i.arr=t.value;
      const ar=(songOf(i.songId)?.arrangements||[]).find(a=>a.name===t.value);
      if(ar) i.len=ar.len;
      toast(`${i.title} — ${t.value}`);
    }
    return render();
  }
  if(d.desc){ const i=item(d.desc); if(i) i.desc=t.value; return; }
  if(d.note){ const i=item(d.nid); if(i){ i.notes[d.note]=t.value; toast("Note saved for the team"); } return render(); }
  if(d.plannote){ if(plan){ plan.notes[d.plannote]=t.value; toast("Plan note saved"); } return; }
  if(d.freq){ const p=personOf(d.freq); if(p){ p.freq=t.value; toast(`${p.name} — ${t.value}`); } return render(); }
  if(t.hasAttribute("data-liveplan")){
    Object.assign(live,{planId:t.value, idx:0, running:false, startedAt:null, base:0, baseTotal:0, elapsed:0, total:0, actual:{}});
    return render();
  }
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && state.modal){ state.modal=null; return render(); }
  /* Space and arrows run the service from the back of the room, but
     only when the live view is up and nothing is being typed into. */
  if(state.view!=="live" || state.modal) return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(e.key===" "){ e.preventDefault(); if(live.running){ absorb(); live.running=false; live.startedAt=null; } else { live.running=true; live.startedAt=Date.now(); } return render(); }
  if(e.key==="ArrowRight"){ e.preventDefault(); liveGo(live.idx+1); return render(); }
  if(e.key==="ArrowLeft"){ e.preventDefault(); liveGo(live.idx-1); return render(); }
});

/* The duplicate button offers the same weekday a week later. */
function nextWeek(iso){
  const d = asDate(iso);
  d.setDate(d.getDate()+7);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

/* ---------------- boot ----------------
   The gate matches the giving portal: any active account may look at
   the schedule, because volunteers need to. The badge stays on "demo"
   in every mode — the schedule below it is sample data either way. */
function adoptProfile(profile){
  const name = profile.full_name || profile.email;
  const match = people.find(p=>p.email?.toLowerCase()===String(profile.email||"").toLowerCase())
    || people.find(p=>p.name.toLowerCase()===String(name||"").toLowerCase());
  if(match){ ME = match.id; }
  else {
    people.unshift({id:"me_"+profile.id, name, role:"Signed in", email:profile.email||"",
      freq:"As needed", can:[], teams:[], since:String(new Date().getFullYear())});
    ME = people[0].id;
  }
  $("#meName").textContent = name;
  $("#meAvatar").textContent = initials(name);
  $("#meRole").textContent = personOf(ME)?.role || "Volunteer";
  state.personId = ME;
}

async function startPortal(){
  render();
  try{
    const session = await getPortalSession();
    if(session.mode==="signed-out") return mountAuthGate();
    if(session.mode==="disabled") return mountForbiddenGate("This account has been deactivated. Ask a church administrator to restore access.");
    if(session.mode==="forbidden") return mountForbiddenGate();
    if(session.profile){ adoptProfile(session.profile); render(); }
    showModeBadge({mode:"demo", portal:"Services"});
  }catch(error){
    showModeBadge({mode:"error", portal:"Services", error:error.message});
  }
}
