<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somos Reino — finance &amp; people</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --coral:#F7746D;
  --coral-deep:#C8483F;
  --coral-wash:#FDECEA;
  --ink:#17151C;
  --ink-2:#221F29;
  --ink-3:#332F3C;
  --paper:#FAF7F5;
  --card:#FFFFFF;
  --line:#E9E2DD;
  --line-2:#D8CFC8;
  --text:#1E1B22;
  --text-2:#6A6371;
  --text-3:#9A9299;
  --sage:#3F7A63;
  --sage-wash:#E7F1EC;
  --amber:#A97613;
  --amber-wash:#FBF0DC;
  --r:10px;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ui:"Schibsted Grotesk",system-ui,sans-serif;
  --display:"Bricolage Grotesque","Schibsted Grotesk",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--ui);
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  font-size:14px;
  line-height:1.45;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--coral);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:236px;flex:0 0 236px;background:var(--ink);color:#EDE8EA;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px}
.brand svg{width:26px;height:26px;display:block}
.brand-name{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.03em;white-space:nowrap}
.brand-sub{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#7E7686;margin-top:1px}
.org{
  margin:0 12px 14px;padding:9px 11px;border:1px solid #302C38;border-radius:8px;
  display:flex;align-items:center;gap:9px;
}
.org-mark{padding:3px 6px;border-radius:5px;background:var(--coral);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:9px;letter-spacing:.08em;color:#3A100D;flex:0 0 auto}
.org-name{font-size:12.5px;font-weight:600;line-height:1.2}
.org-meta{font-family:var(--mono);font-size:9px;color:#7E7686;letter-spacing:.06em}
.nav{padding:4px 12px;display:flex;flex-direction:column;gap:1px}
.nav-eyebrow{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:#5F5869;text-transform:uppercase;padding:14px 9px 6px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;
  color:#B7B0BD;font-size:13.5px;font-weight:500;width:100%;text-align:left;position:relative;
  transition:background .13s,color .13s;
}
.nav-item:hover{background:#221F29;color:#EDE8EA}
.nav-item[aria-current="true"]{background:var(--ink-3);color:#fff}
.nav-item[aria-current="true"]::before{
  content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;background:var(--coral);border-radius:0 3px 3px 0;
}
.nav-ico{width:15px;height:15px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav-count{margin-left:auto;font-family:var(--mono);font-size:10px;background:var(--coral);color:#3A100D;padding:1px 5px;border-radius:20px;font-weight:600}
.nav-count.quiet{background:#302C38;color:#9A9299}
.rail-foot{margin-top:auto;padding:14px 12px 16px;border-top:1px solid #262230}
.me{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;width:100%;text-align:left}
.me:hover{background:#221F29}
.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:0 0 auto;font-family:var(--ui)}
.me-name{font-size:12.5px;font-weight:600;color:#EDE8EA}
.me-role{font-family:var(--mono);font-size:9px;color:#7E7686;letter-spacing:.06em;text-transform:uppercase}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:flex-end;gap:16px;padding:24px 32px 18px;
  border-bottom:1px solid var(--line);background:var(--paper);
  position:sticky;top:0;z-index:20;
}
.crumb{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}
h1{font-family:var(--display);font-size:27px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:3px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.view{padding:22px 32px 60px;max-width:1320px}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:7px;
  font-size:13px;font-weight:600;border:1px solid var(--line-2);background:var(--card);color:var(--text);
  transition:background .13s,border-color .13s,transform .08s;
}
.btn:hover{background:#F3EEEB;border-color:#C6BCB4}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--coral);border-color:var(--coral);color:#3A100D}
.btn-primary:hover{background:#F4605A;border-color:#F4605A}
.btn-dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink-3);border-color:var(--ink-3)}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.sw-toggle:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:#EFE9E5;border-color:transparent}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.card-hd{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-title{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.card-bd{padding:16px}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3)}

.grid{display:grid;gap:14px}
.split{display:grid;gap:14px;grid-template-columns:1.15fr .85fr;align-items:start}
.side{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 300px;align-items:start}
.side-lg{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) 320px;align-items:start}
.duo{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.stack{display:grid;gap:14px;align-content:start}
.tbl{overflow-x:auto}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:5px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;white-space:nowrap}
.t-ok{background:var(--sage-wash);color:var(--sage)}
.t-wait{background:var(--amber-wash);color:var(--amber)}
.t-hot{background:var(--coral-wash);color:var(--coral-deep)}
.t-mute{background:#F1ECE9;color:var(--text-2)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;flex:0 0 auto}

table{width:100%;border-collapse:collapse}
th{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);
  text-align:left;font-weight:500;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
td{padding:11px 14px;border-bottom:1px solid #F2ECE8;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FCFAF9}
.ta-r{text-align:right}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-2)}
.input,select.input,textarea.input{
  border:1px solid var(--line-2);border-radius:7px;padding:7px 10px;background:var(--card);font-size:13.5px;width:100%;
}
.input:focus{outline:none;border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-wash)}
select.input{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%236A6371' fill='none' stroke-width='1.5' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}

.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:5px 11px;border-radius:20px;border:1px solid var(--line-2);background:var(--card);font-size:12.5px;font-weight:500;color:var(--text-2)}
.pill:hover{border-color:#C6BCB4;color:var(--text)}
.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.pill .c{font-family:var(--mono);font-size:10.5px;opacity:.65;margin-left:4px}

.empty{padding:36px 20px;text-align:center;color:var(--text-2)}
.empty strong{display:block;font-size:14px;color:var(--text);margin-bottom:3px;font-weight:600}

/* ---------- fund ribbon ---------- */
.ribbon{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ribbon-top{display:flex;align-items:baseline;gap:10px;margin-bottom:11px}
.ribbon-total{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.03em}
.ribbon-bar{display:flex;height:9px;border-radius:5px;overflow:hidden;gap:2px}
.ribbon-seg{transition:flex .3s}
.ribbon-key{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:11px}
.ribbon-key-item{display:flex;align-items:center;gap:6px;font-size:12px}
.ribbon-key-item .sw{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
.ribbon-key-item .amt{font-family:var(--mono);font-size:11.5px;color:var(--text-2);font-variant-numeric:tabular-nums}

/* ---------- stat tiles ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;text-align:left;width:100%;transition:border-color .13s,transform .1s}
button.tile:hover{border-color:var(--line-2);transform:translateY(-1px)}
.tile-v{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.04em;margin:6px 0 2px}
.tile-note{font-size:11.5px;color:var(--text-2)}
.tile-hot .tile-v{color:var(--coral-deep)}

/* ---------- reconcile matcher (signature) ---------- */
.rec-bar{display:flex;align-items:center;flex-wrap:wrap;gap:18px;background:var(--ink);color:#EDE8EA;border-radius:var(--r);padding:14px 18px}
.rec-bar .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#8B8394}
.rec-bar .v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.03em;margin-top:2px}
.rec-prog{flex:1;min-width:120px}
.rec-track{height:6px;background:#302C38;border-radius:4px;overflow:hidden;margin-top:7px}
.rec-fill{height:100%;background:var(--coral);border-radius:4px;transition:width .4s}

.matcher{display:grid;grid-template-columns:1fr 168px 1fr;gap:0;align-items:start}
.col-hd{display:flex;align-items:center;gap:8px;padding:0 2px 9px}
.col-hd .src{font-size:13px;font-weight:700}
.col-hd .n{font-family:var(--mono);font-size:10.5px;color:var(--text-3);margin-left:auto}
.lane{display:flex;flex-direction:column;gap:8px}

.rowc{
  background:var(--card);border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  width:100%;text-align:left;position:relative;transition:border-color .13s,box-shadow .13s,transform .1s;
}
.rowc:hover{border-color:var(--line-2)}
.rowc[aria-pressed="true"]{border-color:var(--coral);box-shadow:0 0 0 3px var(--coral-wash)}
.rowc.dim{opacity:.5}
.rowc-top{display:flex;align-items:baseline;gap:8px}
.rowc-id{font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.05em}
.rowc-amt{margin-left:auto;font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:-.03em}
.rowc-desc{display:block;font-size:13px;font-weight:600;margin-top:3px}
.rowc-meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:11.5px;color:var(--text-2)}
.rowc-meta .num{font-size:11px}
.sug{position:absolute;top:-6px;right:10px}

.seam{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:34px;align-self:stretch}
.seam-line{position:absolute;top:0;bottom:0;left:50%;width:1px;background:repeating-linear-gradient(to bottom,var(--line-2) 0 4px,transparent 4px 9px)}
.seam-box{position:relative;background:var(--paper);padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.seam-var{font-family:var(--mono);font-size:11px;text-align:center;line-height:1.5}
.seam-var .lab{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);display:block}
.thread{width:100%;height:2px;background:var(--coral);border-radius:2px;transform:scaleX(0);transform-origin:center;transition:transform .25s}
.thread.on{transform:scaleX(1)}

.matched-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:11px 14px;border-bottom:1px solid #F2ECE8}
.matched-row:last-child{border-bottom:none}
.link-mark{display:flex;align-items:center;gap:5px;color:var(--sage);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.link-mark::before,.link-mark::after{content:"";width:14px;height:1px;background:var(--sage);opacity:.5}

@keyframes snap{0%{transform:translateX(var(--dx,0)) scale(1)}55%{transform:translateX(0) scale(1.015)}100%{transform:translateX(0) scale(1);opacity:0}}
.snapping{animation:snap .42s ease forwards}

/* ---------- people ---------- */
.roster{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.prow{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid #F2ECE8;width:100%;text-align:left}
.prow:last-child{border-bottom:none}
.prow:hover{background:#FCFAF9}
.prow[aria-pressed="true"]{background:var(--coral-wash)}
.prow-name{display:block;font-size:13.5px;font-weight:600}
.prow-sub{display:block;font-size:11.5px;color:var(--text-2)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}

.perm{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #F2ECE8}
.perm:last-child{border-bottom:none}
.perm-t{display:block;font-size:13px;font-weight:600}
.perm-d{display:block;font-size:11.5px;color:var(--text-2);margin-top:1px}
.sw-toggle{margin-left:auto;width:36px;height:20px;border-radius:12px;background:#DDD5CF;position:relative;flex:0 0 auto;transition:background .16s}
.sw-toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw-toggle[aria-pressed="true"]{background:var(--sage)}
.sw-toggle[aria-pressed="true"]::after{transform:translateX(16px)}

/* ---------- accounts ---------- */
.conn{display:flex;gap:13px;align-items:flex-start;padding:15px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.conn-logo{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;font-family:var(--display);font-weight:800;font-size:15px}
.conn-name{display:block;font-size:14px;font-weight:700}
.conn-d{display:block;font-size:12px;color:var(--text-2);margin-top:2px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #F2ECE8;font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--text-2)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}

/* ---------- chart ---------- */
.chart{width:100%;height:132px;display:block;overflow:visible}
.bar{fill:var(--coral);opacity:.85;transition:opacity .13s}
.bar.pale{fill:#E9DFDA}
.bar:hover{opacity:1}

/* ---------- feed ---------- */
.feed-item{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #F2ECE8}
.feed-item:last-child{border-bottom:none}
.feed-t{font-size:13px}
.feed-t b{font-weight:600}
.feed-time{font-family:var(--mono);font-size:10px;color:var(--text-3);margin-left:auto;white-space:nowrap;letter-spacing:.04em}

/* ---------- attention list ---------- */
.att{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid #F2ECE8;width:100%;text-align:left}
.att:last-child{border-bottom:none}
.att:hover{background:#FCFAF9}
.att-bar{width:3px;align-self:stretch;border-radius:2px;flex:0 0 auto}
.att-t{display:block;font-size:13.5px;font-weight:600}
.att-d{display:block;font-size:11.5px;color:var(--text-2);margin-top:1px}
.att-go{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.08em;text-transform:uppercase}

/* ---------- modal + toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(23,21,28,.42);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(23,21,28,.28);overflow:hidden}
.modal-hd{padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.modal-t{font-family:var(--display);font-size:19px;font-weight:800;letter-spacing:-.03em}
.modal-d{font-size:12.5px;color:var(--text-2);margin-top:3px}
.modal-bd{padding:18px 20px;display:flex;flex-direction:column;gap:13px;max-height:60vh;overflow:auto}
.modal-ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;background:#FCFAF9}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,14px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;z-index:80;transition:opacity .2s,transform .2s;pointer-events:none;display:flex;align-items:center;gap:8px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast .tick{color:var(--coral);font-family:var(--mono)}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .roster,.split,.side,.side-lg,.duo{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .tiles{grid-template-columns:1fr}
  .rec-bar{flex-wrap:wrap;gap:14px}
  .rec-prog{flex-basis:100%}
  .matched-row{grid-template-columns:1fr;gap:8px}
}
@media (max-width:900px){
  .shell{flex-direction:column}
  .rail{width:100%;flex:none;height:auto;position:static;flex-direction:row;align-items:center;overflow-x:auto;gap:4px;padding-right:10px}
  .brand{padding:14px 14px}
  .brand-sub,.org,.rail-foot,.nav-eyebrow{display:none}
  .nav{flex-direction:row;padding:0;gap:2px}
  .nav-item[aria-current="true"]::before{display:none}
  .topbar{padding:16px 18px 14px}
  .view{padding:16px 18px 50px}
  .matcher{grid-template-columns:1fr}
  .seam{padding:14px 0;flex-direction:row;justify-content:center}
  .seam-line{display:none}
  .seam-box{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:12px}
  .thread{display:none}
  h1{font-size:22px}
}
@media (max-width:900px){
  /* Grid and flex children default to min-width:auto, so a wide table or
     pill row stops its card from shrinking and drags the whole page
     sideways — 425px of it on the expenses view. Letting them shrink is
     what allows .tbl's own overflow-x:auto to scroll and .pills to wrap,
     which both already ask for. */
  .grid,.split,.side,.side-lg,.duo,.roster,.card{min-width:0}
  .tbl{max-width:100%}
}
/* Touch sizing. The finance portal is dense on purpose and a mouse can
   work it comfortably, so grow the controls only for fingers rather than
   loosening the desktop layout everyone else uses. */
@media (max-width:900px),(pointer:coarse){
  .nav-item{min-height:44px}
  .btn{min-height:44px}
  .btn-sm{min-height:44px;padding:8px 12px}
  .pill{min-height:44px}
  .input,select.input,textarea.input{min-height:44px;font-size:16px} /* 16px stops iOS zooming on focus */
  textarea.input{min-height:88px}
  /* The switch keeps its 36x20 look; ::after is already the knob, so the
     touch target goes on ::before. */

  return `<button class="rowc" data-payout="${p.id}" aria-pressed="${on}">

}
function bankCard(b){
  const on = state.sel.bank===b.id;
  const label = b.kind==="stripe" ? "Stripe transfer" : b.kind==="deposit" ? "Branch deposit" : "Other income";
  return `<button class="rowc" data-bank="${b.id}" aria-pressed="${on}">

}

function viewReconcile(){
  const total = payouts.length + bank.length;
  const done = payouts.filter(p=>p.matched).length + bank.filter(b=>b.matched).length;
  const pct = Math.round(done/total*100);
  const sugCount = openPayouts().filter(p=>suggestionFor(p)).length;

  const sp = payouts.find(p=>p.id===state.sel.payout);
  const sb = bank.find(b=>b.id===state.sel.bank);
  const variance = sp&&sb ? sb.amount-sp.net : null;
  const canMatch = sp&&sb;
  const canCode = sb && !sp && sb.kind!=="stripe";

  const matchedPairs = payouts.filter(p=>p.matched).map(p=>({p, b:bank.find(b=>b.id===p.matched)}));
  const recorded = bank.filter(b=>typeof b.matched==="string" && b.matched.startsWith("fund:"));

  const body = state.recTab==="open" ? `
    <div class="matcher">
      <div>
        <div class="col-hd"><span class="src">Stripe payouts</span><span class="n">${openPayouts().length} open</span></div>
        <div class="lane">
          ${openPayouts().length ? openPayouts().map(payoutCard).join("")
            : `<div class="card empty"><strong>Every payout is accounted for</strong>New Stripe payouts show up here the day they're sent.</div>`}
        </div>
      </div>

      <div class="seam">
        <div class="seam-line"></div>
        <div class="seam-box">
          <div class="thread ${canMatch?"on":""}"></div>
          <div class="seam-var">
            ${canMatch ? `
              <span class="lab">Difference</span>
              <span style="font-size:15px;font-weight:600;color:${Math.abs(variance)<0.01?"var(--sage)":"var(--coral-deep)"}">${money(variance)}</span>
            ` : canCode ? `<span class="lab">No Stripe counterpart</span><span style="font-size:12px;color:var(--text-2);line-height:1.35">This money didn't come through Stripe. Record it straight to a fund.</span>`
            : `<span class="lab">Pick one from each side</span>`}
          </div>
          ${canCode
            ? `<button class="btn btn-primary btn-sm" data-act="codeBank" style="width:100%;justify-content:center">Record to a fund</button>`
            : `<button class="btn btn-primary btn-sm" data-act="match" ${canMatch?"":"disabled"} style="width:100%;justify-content:center">Match these</button>`}
          ${sugCount ? `<button class="btn btn-sm" data-act="acceptAll" style="width:100%;justify-content:center">Accept ${sugCount} found</button>` : ""}
          ${(canMatch||canCode) ? `<button class="btn btn-ghost btn-sm" data-act="clearSel" style="width:100%;justify-content:center">Clear</button>` : ""}
          <div class="thread ${canMatch?"on":""}"></div>
        </div>
      </div>

      <div>
        <div class="col-hd"><span class="src">Truist checking ••4417</span><span class="n">${openBank().length} open</span></div>
        <div class="lane">
          ${openBank().length ? openBank().map(bankCard).join("")
            : `<div class="card empty"><strong>The bank feed is clear</strong>Truist syncs every morning at 6:00.</div>`}
        </div>
      </div>
    </div>
  ` : `
    <div class="card">
      ${matchedPairs.length ? matchedPairs.map(({p,b})=>`
        <div class="matched-row">
          <div>
            <div style="font-size:13px;font-weight:600">${p.ref} · ${money(p.net)}</div>
            <div style="font-size:11.5px;color:var(--text-2)">Sent ${p.date} · ${p.gifts} gifts · ${money(p.fees)} in fees</div>
          </div>
          <div class="link-mark">Reconciled</div>
          <div style="display:flex;align-items:center;gap:12px">
            <div>
              <div style="font-size:13px;font-weight:600">${b?b.ref:"—"} · ${b?money(b.amount):""}</div>
              <div style="font-size:11.5px;color:var(--text-2)">${b?esc(b.desc):""} · posted ${b?b.date:""}</div>
            </div>
            <button class="btn btn-sm btn-ghost" data-unmatch="${p.id}" style="margin-left:auto">Undo</button>
          </div>
        </div>`).join("") : ""}
      ${recorded.map(b=>`
        <div class="matched-row">
          <div>
            <div style="font-size:13px;font-weight:600">${esc(b.desc)}</div>
            <div style="font-size:11.5px;color:var(--text-2)">Deposit ${b.ref} · posted ${b.date}</div>
          </div>
          <div class="link-mark">Recorded</div>
          <div style="display:flex;align-items:center;gap:12px">
            <div>
              <div style="font-size:13px;font-weight:600">${money(b.amount)} → ${fundName(b.matched.slice(5))}</div>
              <div style="font-size:11.5px;color:var(--text-2)">No Stripe counterpart · entered by Sam Camacho</div>
            </div>
            <button class="btn btn-sm btn-ghost" data-uncode="${b.id}" style="margin-left:auto">Undo</button>
          </div>
        </div>`).join("")}
      ${(!matchedPairs.length && !recorded.length)
        ? `<div class="empty"><strong>Nothing reconciled yet</strong>Matched pairs and recorded deposits land here with a full audit trail.</div>` : ""}
    </div>
  `;

  return `
  <div class="grid" style="gap:14px">
    <div class="rec-bar">
      <div>
        <div class="k">Unreconciled</div>
        <div class="v">${money(unreconciled())}</div>
      </div>
      <div>
        <div class="k">Open lines</div>
        <div class="v">${openPayouts().length+openBank().length}</div>
      </div>
      <div class="rec-prog">
        <div class="k">July progress · ${done} of ${total} cleared</div>
        <div class="rec-track"><div class="rec-fill" style="width:${pct}%"></div></div>
      </div>
      <button class="btn btn-sm" data-act="exportRec" style="background:transparent;border-color:#3E3948;color:#EDE8EA">Export to CSV</button>
    </div>

    <div style="display:flex;align-items:center;gap:10px">
      <div class="pills">
        <button class="pill" data-rectab="open" aria-pressed="${state.recTab==="open"}">To match<span class="c">${openPayouts().length+openBank().length}</span></button>
        <button class="pill" data-rectab="done" aria-pressed="${state.recTab==="done"}">Reconciled<span class="c">${matchedPairs.length+recorded.length}</span></button>
      </div>
      <span style="margin-left:auto;font-size:12px;color:var(--text-2)">Stripe fees post to <b>General → Processing fees</b> automatically.</span>
    </div>

    ${body}
  </div>`;
}

/* ---------------- toast ---------------- */
let toastTimer;
function toast(msg){
  const el = $("#toast");
  el.innerHTML = `<span class="tick">✓</span> ${msg}`;
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("on"), 2600);
}

  $("#title").textContent = TITLES[state.view].t;
  $("#topActions").innerHTML = topActions();
  $("#view").innerHTML = VIEWS[state.view]();

/* ---------------- events ---------------- */
document.addEventListener("click", async e=>{
  const t = e.target.closest("[data-nav],[data-payout],[data-bank],[data-act],[data-rectab],[data-expfilter],[data-approve],[data-deny],[data-reimburse],[data-person],[data-perm],[data-unmatch],[data-uncode],[data-refund],[data-fundvis],[data-modaltoggle],[data-scrim]");
  if(!t) return;

  if(t.hasAttribute("data-scrim") && e.target===t){ state.modal=null; return render(); }

  const nav = t.dataset.nav;
  if(nav){ state.view=nav; window.scrollTo({top:0}); return render(); }

  if(t.dataset.rectab){ state.recTab=t.dataset.rectab; return render(); }
  if(t.dataset.expfilter){ state.expFilter=t.dataset.expfilter; return render(); }
  if(t.dataset.person){ state.personId=t.dataset.person; return render(); }

  if(t.dataset.payout){
    state.sel.payout = state.sel.payout===t.dataset.payout ? null : t.dataset.payout;
    const p = payouts.find(x=>x.id===state.sel.payout);
    if(p && !state.sel.bank){ const s = suggestionFor(p); if(s) state.sel.bank = s.id; }
    return render();
  }
  if(t.dataset.bank){
    state.sel.bank = state.sel.bank===t.dataset.bank ? null : t.dataset.bank;
    return render();
  }

  if(t.dataset.uncode){
    const b = bank.find(x=>x.id===t.dataset.uncode);
    if(backendMode==="ready"){
      try{ await undoRecordedBankTransaction(b.id); }
      catch(error){ toast(error.message); return; }
    }
    const f = FUNDS.find(x=>x.id===b.matched.slice(5)); if(f) f.bal -= b.amount;
    b.matched=null;
    toast(`Deposit ${b.ref} moved back to the open list`);
    return render();
  }
  if(t.dataset.unmatch){
    const p = payouts.find(x=>x.id===t.dataset.unmatch);
    if(backendMode==="ready"){
      try{ await undoReconciliation(p.matchId); }
      catch(error){ toast(error.message); return; }
    }
    const b = bank.find(x=>x.id===p.matched);
    p.matched=null; if(b) b.matched=null;
    toast(`${p.ref} moved back to the open list`);
    return render();
  }

  if(t.dataset.approve){ const ex=expenses.find(x=>x.id===t.dataset.approve); if(backendMode==="ready"){try{await setExpenseStatus(ex.id,"approved");}catch(error){toast(error.message);return;}} ex.status="approved"; toast(`Approved ${ex.desc} — ${money(ex.amount)}`); return render(); }
  if(t.dataset.deny){ const ex=expenses.find(x=>x.id===t.dataset.deny); ex.note="Denied by finance leadership — the submitter was notified"; if(backendMode==="ready"){try{await setExpenseStatus(ex.id,"denied",ex.note);}catch(error){toast(error.message);return;}} ex.status="denied"; toast(`Denied ${ex.desc}`); return render(); }
  if(t.dataset.reimburse){ const ex=expenses.find(x=>x.id===t.dataset.reimburse); if(backendMode==="ready"){try{await setExpenseStatus(ex.id,"reimbursed");}catch(error){toast(error.message);return;}} ex.status="reimbursed"; toast(`${ex.who} will be reimbursed ${money(ex.amount)}`); return render(); }
  if(t.dataset.refund){ const g=gifts.find(x=>x.id===t.dataset.refund); state.modal={kind:"generic",title:"Refund this gift?",desc:`${g.who} · ${money(g.amount)} to ${fundName(g.fund)}`,body:"Stripe returns the full amount in 5–10 days. The fund balance and the giver's statement both update tonight. Processing fees are not returned."}; return render(); }

  if(t.dataset.perm){
    const p = people.find(x=>x.id===t.dataset.pid);
    p.perms[t.dataset.perm] = !p.perms[t.dataset.perm];
    if(backendMode==="ready"){
      try{ await updateMemberPermissions(p.id,p.perms); }
      catch(error){ p.perms[t.dataset.perm]=!p.perms[t.dataset.perm]; toast(error.message); return; }
    }
    const def = PERM_DEFS.find(d=>d.k===t.dataset.perm);
    toast(`${p.name.split(" ")[0]} ${p.perms[t.dataset.perm]?"can now":"can no longer"} ${def.t.toLowerCase()}`);
    return render();
  }
  if(t.hasAttribute("data-fundvis")||t.hasAttribute("data-modaltoggle")){
    const on = t.getAttribute("aria-pressed")==="true";
    t.setAttribute("aria-pressed", String(!on));
    return;
  }

  const act = t.dataset.act;
  if(!act) return;

  if(act==="match"){
    const p = payouts.find(x=>x.id===state.sel.payout), b = bank.find(x=>x.id===state.sel.bank);
    if(!p||!b) return;
    if(backendMode==="ready"){
      try{ const result=await reconcileTransactions(p.id,b.id); p.matchId=result.id; }
      catch(error){ toast(error.message); return; }
    }
    p.matched=b.id; b.matched=p.id;
    state.sel={payout:null,bank:null};
    toast(`${p.ref} reconciled against deposit ${b.ref}`);
    return render();
  }
  if(act==="acceptAll"){
    let n=0;
    const candidates=openPayouts().map(p=>({p,s:suggestionFor(p)})).filter(x=>x.s);
    for(const {p,s} of candidates){
      if(backendMode==="ready"){
        try{ const result=await reconcileTransactions(p.id,s.id); p.matchId=result.id; }
        catch(error){ toast(error.message); continue; }
      }
      p.matched=s.id; s.matched=p.id; n++;
    }
    state.sel={payout:null,bank:null};
    if(state.view!=="reconcile") state.view="reconcile";
    toast(n? `${n} payouts reconciled` : "No confident matches left — the rest need a human");
    return render();
  }
  if(act==="clearSel"){ state.sel={payout:null,bank:null}; return render(); }
  if(act==="codeBank"){
    const b = bank.find(x=>x.id===state.sel.bank);
    if(!b) return;
    state.modal={kind:"codeBank", desc:`${b.desc} · ${money(b.amount)} · posted ${b.date}`};
    return render();
  }

  if(act==="newExpense"){ state.modal={kind:"newExpense"}; return render(); }
  if(act==="createAccount"){ state.modal={kind:"createAccount"}; return render(); }
  if(act==="remove"){
    const person=people.find(p=>p.id===t.dataset.pid);
    if(person){ state.modal={kind:"removeAccess",personId:person.id,personName:person.name}; return render(); }
  }
  if(act==="restore"){
    const person=people.find(p=>p.id===t.dataset.pid);
    if(!person) return;
    if(backendMode==="ready"){
      try{ await reactivateMember(person.id); }
      catch(error){ toast(error.message); return; }
    }
    person.active=true; person.disabledAt=null;
    state.peopleStatus="active";
    toast(`${person.name}'s account is active again`);
    return render();
  }
  if(act==="newLink"){ state.modal={kind:"newLink"}; return render(); }
  if(act==="closeModal"){ state.modal=null; return render(); }

  if(act==="confirmModal"){
    const kind = state.modal?.kind;
    if(kind==="newExpense"){
      const desc = $("#mx_desc")?.value.trim(), amt = parseFloat($("#mx_amt")?.value||"0");
      if(desc && amt>0){
        let created={id:"e"+Date.now()};
        if(backendMode==="ready"){
          try{ created=await createExpense({submitter_id:currentUserId,fund_id:FUNDS.find(f=>f.id===$("#mx_fund").value).dbId,description:desc,team_name:$("#mx_team").value,amount_cents:Math.round(amt*100),note:"Receipt still needed"}); }
          catch(error){ toast(error.message); return; }
        }
        expenses.unshift({id:created.id, desc, who:currentUserName, team:$("#mx_team").value, fund:$("#mx_fund").value, amount:amt, date:new Date().toLocaleDateString("en-US",{month:"short",day:"2-digit"}), status:"pending", receipt:false, note:"Receipt still needed"});
        state.expFilter="pending"; state.view="expenses";
        toast(`Sent ${desc} to Marisol for approval`);
      } else toast("Add a description and an amount above zero");
    } else if(kind==="createAccount"){
      const name = $("#mi_name")?.value.trim(), email = $("#mi_email")?.value.trim();
      if(name && email){
        let invited={userId:"p"+Date.now()};
        if(backendMode==="ready"){
          const uiRole=$("#mi_role").value;
          const role=uiRole==="Admin"?"admin":uiRole==="Finance"?"finance":"member";
          try{ invited=await createMemberAccount({email,fullName:name,role,teamName:$("#mi_team").value}); }
          catch(error){ toast(error.message); return; }
        }
        people.push({id:invited.userId, name, role:$("#mi_role").value, teams:[$("#mi_team").value], email, phone:"—", since:String(new Date().getFullYear()), last:"Invited", bg:"missing", active:true, disabledAt:null, perms:{finance:false,approve:false,refund:false,people:false,payouts:false}});
        state.view="people"; state.personId = people[people.length-1].id;
        state.peopleStatus="active";
        toast(`Account created — invite sent to ${email}`);
      } else { toast("A name and an email are needed to create the account"); return; }
    } else if(kind==="removeAccess"){
      const person=people.find(p=>p.id===state.modal.personId);
      if(!person) return;
      if(backendMode==="ready"){
        try{ await deactivateMember(person.id); }
        catch(error){ toast(error.message); return; }
      }
      person.active=false; person.disabledAt=new Date().toISOString();
      state.peopleStatus="inactive";
      toast(`${person.name}'s access was removed`);
    } else if(kind==="codeBank"){
      const b = bank.find(x=>x.id===state.sel.bank);
      const fid = $("#mc_fund").value;
      if(b){
        if(backendMode==="ready"){
          try{ await recordBankTransaction(b.id,FUNDS.find(f=>f.id===fid).dbId,$("#mc_cat").value,$("#mc_note").value); }
          catch(error){ toast(error.message); return; }
        }
        b.matched = "fund:"+fid;
        const f = FUNDS.find(x=>x.id===fid); if(f) f.bal += b.amount;
        state.sel={payout:null,bank:null};
        toast(`${money(b.amount)} recorded to ${fundName(fid)}`);
      }
    } else if(kind==="newLink"){
      const n = $("#ml_name")?.value.trim() || "Untitled";
      toast(`Live at give.somosreino.org/${n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}`);
    } else {
      toast("Done");
    }
    state.modal=null;
    return render();
  }

  const blurbs = {
    exportRec:"CSV on its way to your downloads",
    rules:"Matching rules open in the full build",
    stripeDash:"Opening the Stripe dashboard",
    givingSettings:"Giving page settings open in the full build",
    payoutSettings:"Payout settings open in the full build",
    addFund:"New fund setup opens in the full build",
    message:"Message composer opens in the full build",
    conn:`Starting the connection for ${t.dataset.name||"this account"}`,
    me:"Your profile opens in the full build",
  };
  if(blurbs[act]) toast(blurbs[act]);
});

document.addEventListener("input", e=>{
  const t=e.target;
  if(t.hasAttribute("data-peopleq")){ state.peopleQ=t.value; const pos=t.selectionStart; render(); const el=$("[data-peopleq]"); if(el){el.focus(); el.setSelectionRange(pos,pos);} }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.hasAttribute("data-peoplerole")){ state.peopleRole=t.value; return render(); }
  if(t.hasAttribute("data-peoplestatus")){ state.peopleStatus=t.value; return render(); }
  if(t.hasAttribute("data-givefund")){ state.giveFund=t.value; return render(); }
  if(t.hasAttribute("data-givemethod")){ state.giveMethod=t.value; return render(); }
  if(t.dataset.fundset){ const ex=expenses.find(x=>x.id===t.dataset.fundset); ex.fund=t.value; toast(`${ex.desc} now codes to ${fundName(t.value)}`); return render(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && state.modal){ state.modal=null; render(); } });

let backendMode="demo";
let currentUserId=null;
let currentUserName="Sam Camacho";

function shortDate(value){ return value ? new Date(value.includes("T")?value:value+"T12:00:00").toLocaleDateString("en-US",{month:"short",day:"2-digit"}) : "—"; }
function hydrateFinance(snapshot,profile){
  const fundIdByDb=new Map(snapshot.funds.map(f=>[f.id,f.slug]));
  const matchByPayout=new Map(snapshot.matches.map(m=>[m.payout_id,m]));
  const matchByBank=new Map(snapshot.matches.map(m=>[m.bank_transaction_id,m]));
  const ledgerByBank=new Map(snapshot.ledgerEntries.map(e=>[e.bank_transaction_id,e]));
  FUNDS=snapshot.funds.map(f=>({id:f.slug,dbId:f.id,name:f.name_en,color:f.color,bal:f.current_balance_cents/100}));
  payouts=snapshot.payouts.map(p=>{const m=matchByPayout.get(p.id);return{id:p.id,ref:p.stripe_payout_id,date:shortDate(p.created_at),arrives:shortDate(p.arrival_date),gross:p.gross_cents/100,fees:p.fee_cents/100,net:p.net_cents/100,gifts:p.gift_count,matched:m?.bank_transaction_id||null,matchId:m?.id||null};});
  bank=snapshot.bankTransactions.map(b=>{const m=matchByBank.get(b.id),entry=ledgerByBank.get(b.id);return{id:b.id,ref:b.external_transaction_id?.slice(-8)||b.id.slice(0,8),date:shortDate(b.posted_at),desc:b.description,amount:b.amount_cents/100,kind:b.kind,matched:m?.payout_id||(entry?`fund:${entry.funds.slug}`:null)};});
  expenses=snapshot.expenses.map(e=>({id:e.id,desc:e.description,who:e.profiles?.full_name||"Unknown",team:e.team_name||"—",fund:fundIdByDb.get(e.fund_id),amount:e.amount_cents/100,date:shortDate(e.created_at),status:e.status,receipt:Boolean(e.receipt_path),note:e.note||""}));
  gifts=snapshot.donations.map(g=>({id:g.id,who:g.anonymous?"Anonymous":g.profiles?.full_name||"Unknown",fund:g.funds.slug,amount:g.amount_cents/100,date:shortDate(g.occurred_at),method:g.payment_method_type||"Card",recurring:Boolean(g.recurring_gift_id),fee:g.processing_fee_cents/100,covered:g.processing_fee_cents>0}));
  people=snapshot.profiles.map(p=>({id:p.id,name:p.full_name||p.email,role:p.role==="admin"?"Admin":p.role==="finance"?"Finance":"Member",teams:p.team_names||[],email:p.email,phone:p.phone||"—",since:new Date(p.created_at).getFullYear().toString(),last:"—",bg:"missing",active:p.is_active!==false,disabledAt:p.disabled_at,perms:{finance:false,approve:false,refund:false,people:false,payouts:false,...(p.permissions||{})}}));
  weekly=[...Array(9)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(8-i)*7);const next=new Date(d);next.setDate(next.getDate()+7);return{w:shortDate(d.toISOString()),v:gifts.filter(g=>{const gd=new Date(g.date+", "+new Date().getFullYear());return gd>=d&&gd<next;}).reduce((s,g)=>s+g.amount,0)};});
  feed=[];
  currentUserId=profile.id; currentUserName=profile.full_name||profile.email;
  state.personId=people[0]?.id||null;
  const nameEl=document.querySelector(".me-name");if(nameEl)nameEl.textContent=currentUserName;
}

async function startPortal(){
  render();
  try{
    const session=await getPortalSession({staffOnly:true});
    backendMode=session.mode;
    if(session.mode==="demo")return showModeBadge({mode:"demo",portal:"Finance"});
    if(session.mode==="signed-out")return mountAuthGate({staffOnly:true});
    if(session.mode==="disabled")return mountForbiddenGate("This account has been deactivated. Ask another administrator to restore access.");
    if(session.mode==="forbidden")return mountForbiddenGate();
    const snapshot=await loadFinanceSnapshot();
    hydrateFinance(snapshot,session.profile);
    render();
    showModeBadge({mode:"ready",portal:"Finance"});
  }catch(error){showModeBadge({mode:"error",portal:"Finance",error:error.message});}
}

await startPortal();
</script>
