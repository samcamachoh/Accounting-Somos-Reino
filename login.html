<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Somos Reino · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--coral:#F7746D;--coral-deep:#C8483F;--ink:#17151C;--paper:#FBF8F6;--card:#fff;--line:#E9E2DD;--line-2:#D8CFC8;--muted:#6C6570;--sage:#3F7A63}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,sans-serif;padding:24px}
    main{width:min(430px,100%)}
    .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
    .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
    .langs{display:flex;gap:2px;background:#F0EAE6;border-radius:999px;padding:3px}
    .langs button{border:0;background:none;padding:5px 11px;border-radius:999px;font:700 11px/1 inherit;color:var(--muted);cursor:pointer}
    .langs button[aria-pressed="true"]{background:var(--ink);color:#fff}
    .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px}
    h1{font:800 clamp(28px,5vw,34px)/1.08 "Bricolage Grotesque",sans-serif;letter-spacing:-.035em;margin-bottom:10px}
    .lead{color:var(--muted);line-height:1.5;font-size:15px;margin-bottom:24px}
    label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
    input{width:100%;padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;font:400 15px/1.3 inherit;color:inherit;background:#fff;margin-bottom:16px}
    input:focus{outline:2px solid var(--coral);outline-offset:1px;border-color:transparent}
    button.primary{width:100%;padding:13px 16px;border:0;border-radius:10px;background:var(--coral);color:#fff;font:700 15px/1 inherit;cursor:pointer}
    button.primary:disabled{opacity:.6;cursor:default}
    .row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
    button.link{background:none;border:0;padding:0;color:var(--coral-deep);font:600 13px/1.4 inherit;cursor:pointer;text-decoration:underline}
    .msg{margin-top:16px;font-size:14px;line-height:1.5;min-height:1.3em}
    .msg.err{color:var(--coral-deep)}
    .msg.ok{color:var(--sage)}
    .msg.info{color:var(--muted)}
    #clerk-root{min-height:120px;display:flex;justify-content:center}
    /* Once Clerk draws its own card, ours steps aside so the two don't fight over width. */
    .card.clerk{background:none;border:0;padding:0}
    .card.clerk .msg{padding:0 4px}
    #clerk-root:empty::before{content:attr(data-loading);color:var(--muted);font-size:14px;align-self:center}
    .demo{margin-top:20px;padding:14px 16px;border:1px dashed var(--line-2);border-radius:12px;color:var(--muted);font-size:13px;line-height:1.5}
    .foot{text-align:center;margin-top:20px;font-size:12px;color:var(--muted)}
    [hidden]{display:none !important}
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="eyebrow">Somos Reino</div>
      <div class="langs" role="group" aria-label="Idioma">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>

    <div class="card">
      <!-- Clerk mounts its sign-in (or, from an invitation link, sign-up) here -->
      <div id="clerk-root" data-loading=""></div>

      <p class="msg" id="msg" role="status"></p>
      <button class="link" type="button" id="btnRetry" hidden></button>
      <div class="demo" id="demoNote" hidden></div>
    </div>
  </main>

<script type="module">
import { isConfigured } from "/src/lib/db.js";
import { clerk, loadClerk } from "/src/lib/clerk.js";

const $ = (s) => document.querySelector(s);

const STR = {
  loading:   {es:"Cargando…", en:"Loading…"},
  loadFail:  {es:"No pudimos cargar el inicio de sesión. Revisa tu conexión e inténtalo de nuevo.", en:"We couldn't load sign-in. Check your connection and try again."},
  retry:     {es:"Reintentar", en:"Try again"},
  demoTitle: {es:"Modo demostración", en:"Demo mode"},
  demoBody:  {es:"Aún no hay inicio de sesión configurado, así que no hay cuentas. Agrega la dirección de la base de datos y la clave de Clerk en tu archivo .env (ver .env.example) para activarlo.",
              en:"Sign-in isn't configured yet, so there are no accounts. Add your database address and Clerk key to your .env file (see .env.example) to turn it on."},
};

let lang = (() => { try { return localStorage.getItem("sr-lang") || "es"; } catch { return "es"; } })();
const t = (k) => STR[k][lang];

function paint(){
  document.documentElement.lang = lang;
  $("#clerk-root").dataset.loading = t("loading");
  $("#btnRetry").textContent = t("retry");
  $("#demoNote").innerHTML = `<b>${t("demoTitle")}</b><br>${t("demoBody")}`;
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

/* Clerk's own screens speak the language chosen when Clerk loaded, so a
   change here reloads rather than leaving half the page in the old one. */
document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  try { localStorage.setItem("sr-lang", b.dataset.lang); } catch { /* private mode: still switch this visit */ }
  location.reload();
}));

/* Where to land once signed in. Only same-origin paths are honoured,
   so a crafted ?next= can't bounce anyone off to another site. */
function destination(){
  const next = new URLSearchParams(location.search).get("next");
  if (next && next.startsWith("/") && !next.startsWith("//") && !next.startsWith("/\\")) return next;
  return "/index.html";
}

const BRAND = {
  variables: { colorPrimary: "#F7746D", colorText: "#17151C", borderRadius: "10px", fontFamily: '"Schibsted Grotesk", system-ui, sans-serif' },
  elements: { rootBox: { width: "100%", maxWidth: "400px" }, cardBox: { width: "100%", maxWidth: "400px" } },
};

async function start(){
  paint();
  $("#msg").textContent = ""; $("#btnRetry").hidden = true;

  if (!isConfigured) {
    $("#clerk-root").hidden = true;
    $("#demoNote").hidden = false;
    return;
  }

  try {
    await loadClerk({ ui: true });
  } catch (error) {
    console.error("Clerk failed to load:", error);
    return failed();
  }

  /* Already signed in? Don't make them do it again. */
  if (clerk.isSignedIn) return location.replace(destination());

  /* An invitation link carries a ticket: that is the one way to create an
     account, and it is a sign-up, not a sign-in. */
  const invited = new URLSearchParams(location.search).has("__clerk_ticket");
  const props = { ...BRAND, routing: "hash", forceRedirectUrl: destination() };
  $(".card").classList.add("clerk");
  try {
    if (invited) clerk.mountSignUp($("#clerk-root"), { ...props, signInUrl: "/login.html" });
    else clerk.mountSignIn($("#clerk-root"), props);
  } catch (error) {
    console.error("Clerk could not draw the sign-in box:", error);
    return failed();
  }

  /* If nothing has drawn after a while, say so rather than sit on "Loading…". */
  setTimeout(() => { if (!$("#clerk-root").childElementCount) failed(); }, 15000);
}

function failed(){
  $("#clerk-root").dataset.loading = "";
  $("#msg").className = "msg err"; $("#msg").textContent = t("loadFail");
  $("#btnRetry").hidden = false;
}

$("#btnRetry").addEventListener("click", start);
await start();
</script>
</body>
</html>
